function render() {
  renderStatus();
  renderScenarios();
  renderCohortList();
  renderModuleLegend();
  renderHolidayClashes();
  renderCalendar();
  renderTimeline();
  renderWeekDisplay();
  renderGrid();
  renderTotals();
  renderSummary();
  renderTimelineMeta();
  renderFooter();
}

function renderFooter() {
  const stamp = formatStamp(published.updatedAt);
  $('footerText').textContent = 'SA public holidays and Christmas closures included' + (stamp ? ' · Plan last published ' + stamp : '');
}

function renderScenarios() {
  const sel = $('scenarioSelect');
  const label = sel.previousElementSibling;
  const names = Object.keys(state.scenarios);

  sel.innerHTML = '';
  names.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    if (name === state.currentScenario) opt.selected = true;
    sel.appendChild(opt);
  });

  const single = names.length <= 1;
  sel.hidden = single;
  if (label) label.hidden = single;
  $('deleteBtn').hidden = single;
}

function renderModuleLegend() {
  const el = $('moduleLegend');
  el.innerHTML = '';
  LEVELS.forEach(l => {
    const card = document.createElement('div');
    card.className = 'level-card level-' + l.id;
    card.innerHTML = `
      <div class="level-head"><span class="level-name">${esc(l.name)}</span><span class="level-length">${esc(l.length)}</span></div>
      <div class="level-modules">${esc(l.detail)}</div>`;
    el.appendChild(card);
  });
}

function shortDate(d) { return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); }
function longDate(d) { return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); }

function facilitatorSummary(item, ts) {
  if (!ts) return personName(item.facilitator);
  const facs = ts.days.map(day => ({
    day,
    name: personName((item.facilitators && item.facilitators[day]) || item.facilitator || 'iain'),
  }));
  const unique = [...new Set(facs.map(f => f.name))];
  return unique.length === 1 ? unique[0] : facs.map(f => `${f.day}: ${f.name}`).join(' · ');
}

function clashHtml(clashes) {
  if (!clashes || clashes.length === 0) return '';
  const text = clashes.map(c => `${esc(c.label)} (${c.sharedDays.join('/')})`).join(', ');
  return `<div class="clash-text">⚠ Clashes with ${text}</div>`;
}

function renderCohortList() {
  const el = $('cohortList');
  const scn = currentScn();
  el.innerHTML = '';

  const l3Groups = scn.ongoing.filter(o => o.type === 'l3');
  const otherOngoing = scn.ongoing.filter(o => o.type !== 'l3');
  const totalCohorts = scn.cohorts.length;
  $('cohortPanelMeta').textContent =
    `${totalCohorts} Level 1–2 cohort${totalCohorts !== 1 ? 's' : ''} · ` +
    `${l3Groups.length} Level 3 group${l3Groups.length !== 1 ? 's' : ''} · ` +
    `${otherOngoing.length} other activit${otherOngoing.length !== 1 ? 'ies' : 'y'}`;

  if (totalCohorts === 0 && scn.ongoing.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'no-cohorts';
    empty.innerHTML = isEditable()
      ? '<strong>Nothing planned yet.</strong><br>Add a Level 1–2 cohort or a Level 3 group below, or use <strong>Import</strong> to bring in a scenario you exported from the older planner file.'
      : '<strong>Nothing has been planned in this scenario yet.</strong><br>Check back once the plan has been published.';
    el.appendChild(empty);
    return;
  }

  const clashes = clashesById(scn);

  const sortedCohorts = [...scn.cohorts].sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));
  sortedCohorts.forEach(cohort => {
    const ts = TIMESLOTS.find(t => t.id === cohort.timeslotId);
    const startDate = parseDate(cohort.startDate);
    const endDate = cohortEndDate(cohort);
    const spans = cohortLevelSpans(cohort);
    const uniqueHolidayDays = new Set(cohort.sessions.filter(s => s.isHoliday).map(s => s.dateStr)).size;
    const myClashes = clashes[cohort.id];

    let warnings = clashHtml(myClashes);
    if (uniqueHolidayDays > 0) {
      warnings += `<div class="holiday-text">${uniqueHolidayDays} day${uniqueHolidayDays !== 1 ? 's' : ''} affected by holidays</div>`;
    }
    const levels = [1, 2].filter(l => spans[l])
      .map(l => `<span class="l${l}">L${l}</span> ${shortDate(spans[l].start)} → ${shortDate(spans[l].end)}`)
      .join(' · ');

    const row = document.createElement('div');
    row.className = 'cohort-row training' + (myClashes ? ' clash' : '');
    row.innerHTML = `
      <div class="cohort-name">Cohort ${esc(cohort.number)}</div>
      <div class="cohort-detail-wrap">
        <div class="cohort-detail">${ts ? ts.short : ''} · ${facilitatorSummary(cohort, ts)}</div>
        <div class="cohort-stat">
          <span class="value">${shortDate(startDate)}</span> → <span class="value">${endDate ? longDate(endDate) : '?'}</span>
        </div>
        <div class="cohort-levels">${levels}</div>
      </div>
      <div class="cohort-stat">Participants <span class="value">${esc(cohort.participants)}</span></div>
      <div class="cohort-warnings">${warnings}</div>
      <div class="cohort-actions edit-only">
        <button class="small" data-action="edit-cohort" data-id="${esc(cohort.id)}">Edit</button>
        <button class="small warn" data-action="delete-cohort" data-id="${esc(cohort.id)}">Delete</button>
      </div>
    `;
    el.appendChild(row);
  });

  l3Groups.forEach(g => {
    const ts = TIMESLOTS.find(t => t.id === g.timeslotId);
    const endDate = g.endDate ? parseDate(g.endDate) : null;
    const myClashes = clashes[g.id];
    const row = document.createElement('div');
    row.className = 'cohort-row l3' + (myClashes ? ' clash' : '');
    row.innerHTML = `
      <div class="cohort-name">${esc(g.name)}</div>
      <div class="cohort-detail-wrap">
        <div class="cohort-detail">${ts ? ts.short : '?'} · ${facilitatorSummary(g, ts)}</div>
        <div class="cohort-stat">
          <span class="value">${shortDate(parseDate(g.startDate))}</span> → <span class="value">${endDate ? longDate(endDate) : 'Ongoing'}</span>
        </div>
        <div class="cohort-levels">Rolling intake · up to 6 months per participant</div>
      </div>
      <div class="cohort-stat">Participants <span class="value">${esc(g.participants)}</span></div>
      <div class="cohort-warnings">${clashHtml(myClashes)}</div>
      <div class="cohort-actions edit-only">
        <button class="small" data-action="edit-l3" data-id="${esc(g.id)}">Edit</button>
        <button class="small warn" data-action="delete-ongoing" data-id="${esc(g.id)}">Delete</button>
      </div>
    `;
    el.appendChild(row);
  });

  otherOngoing.forEach(ong => {
    const startDate = parseDate(ong.startDate);
    const endDate = ong.endDate ? parseDate(ong.endDate) : null;
    const slotDesc = ong.slots.map(s => `${s.day} ${s.session.toUpperCase()}`).join(', ');

    const row = document.createElement('div');
    row.className = 'cohort-row ' + esc(ong.type);
    row.innerHTML = `
      <div class="cohort-name">${esc(ong.name)}</div>
      <div class="cohort-detail-wrap">
        <div class="cohort-detail">${esc(slotDesc)} · ${personName(ong.facilitator)}</div>
        <div class="cohort-stat">
          <span class="value">${shortDate(startDate)}</span> → <span class="value">${endDate ? longDate(endDate) : 'Ongoing'}</span>
        </div>
      </div>
      <div class="cohort-stat">${esc(ACTIVITY_LABELS[ong.type] || ong.type)}</div>
      <div class="cohort-warnings"></div>
      <div class="cohort-actions edit-only">
        <button class="small" data-action="edit-ongoing" data-id="${esc(ong.id)}">Edit</button>
        <button class="small warn" data-action="delete-ongoing" data-id="${esc(ong.id)}">Delete</button>
      </div>
    `;
    el.appendChild(row);
  });

  el.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      switch (btn.dataset.action) {
        case 'delete-cohort': deleteCohort(id); break;

        case 'delete-ongoing': deleteOngoing(id); break;
        case 'edit-ongoing': openOngoingForm(id); break;
      }
    });
  });
}

function renderCalendar() {
  const today = formatDateISO(new Date());
  const editable = isEditable();
  const cal = state.calendar;

  const upcomingHolidays = cal.holidays.filter(h => h.date >= today).length;
  const upcomingClosures = cal.closures.filter(c => c.end >= today).length;
  $('holidayPanelMeta').textContent =
    `${upcomingHolidays} upcoming public holiday${upcomingHolidays !== 1 ? 's' : ''} · ` +
    `${upcomingClosures} upcoming closure${upcomingClosures !== 1 ? 's' : ''}`;
  $('showPastHolidaysBtn').textContent = showPastHolidays ? 'Hide past dates' : 'Show past dates';

  const field = (type, value, label, onChange) => {
    const input = document.createElement('input');
    input.type = type;
    input.value = value;
    input.setAttribute('aria-label', label);
    input.addEventListener('change', () => onChange(input.value.trim(), input));
    return input;
  };
  const removeBtn = (label, onClick) => {
    const b = document.createElement('button');
    b.className = 'small cal-remove';
    b.textContent = '×';
    b.setAttribute('aria-label', label);
    b.addEventListener('click', onClick);
    return b;
  };
  const textRow = (dateText, name, past) => {
    const row = document.createElement('div');
    row.className = 'cal-text' + (past ? ' past' : '');
    row.innerHTML = `<span class="d">${esc(dateText)}</span><span>${esc(name)}</span>`;
    return row;
  };
  const fmt = iso => parseDate(iso).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  // Public holidays
  const hl = $('holidayList');
  hl.innerHTML = '';
  cal.holidays.forEach((h, i) => {
    const past = h.date < today;
    if (past && !showPastHolidays) return;
    if (!editable) { hl.appendChild(textRow(fmt(h.date), h.name, past)); return; }
    const row = document.createElement('div');
    row.className = 'cal-row' + (past ? ' past' : '');
    row.append(
      field('date', h.date, 'Holiday date', v => { if (ISO_DATE.test(v)) { cal.holidays[i].date = v; calendarChanged(); } }),
      field('text', h.name, 'Holiday name', v => { cal.holidays[i].name = v || 'Public holiday'; calendarChanged(); }),
      removeBtn('Remove ' + h.name, () => { cal.holidays.splice(i, 1); calendarChanged(); }),
    );
    hl.appendChild(row);
  });
  if (editable) {
    const row = document.createElement('div');
    row.className = 'cal-row add-row';
    const date = field('date', '', 'New holiday date', () => {});
    const name = field('text', '', 'New holiday name', () => {});
    name.placeholder = 'Holiday name';
    const add = document.createElement('button');
    add.className = 'small';
    add.textContent = 'Add';
    add.addEventListener('click', () => {
      if (!ISO_DATE.test(date.value)) { toast('Pick a date for the holiday.'); return; }
      cal.holidays.push({ date: date.value, name: name.value.trim() || 'Public holiday' });
      calendarChanged();
    });
    row.append(date, name, add);
    hl.appendChild(row);
  } else if (!hl.children.length) {
    hl.appendChild(textRow('', 'None listed', false));
  }

  // Closures
  const cl = $('closureList');
  cl.innerHTML = '';
  cal.closures.forEach((c, i) => {
    const past = c.end < today;
    if (past && !showPastHolidays) return;
    if (!editable) { cl.appendChild(textRow(`${shortDate(parseDate(c.start))} – ${longDate(parseDate(c.end))}`, c.name, past)); return; }
    const row = document.createElement('div');
    row.className = 'cal-row closure' + (past ? ' past' : '');
    const setRange = (key, v, input) => {
      if (!ISO_DATE.test(v)) return;
      const next = { ...c, [key]: v };
      if (next.end < next.start) { toast('A closure must end on or after the day it starts.'); input.value = c[key]; return; }
      cal.closures[i] = next;
      calendarChanged();
    };
    row.append(
      field('date', c.start, 'Closure first day', (v, inp) => setRange('start', v, inp)),
      field('date', c.end, 'Closure last day', (v, inp) => setRange('end', v, inp)),
      field('text', c.name, 'Closure name', v => { cal.closures[i].name = v || 'Closure'; calendarChanged(); }),
      removeBtn('Remove ' + c.name, () => { cal.closures.splice(i, 1); calendarChanged(); }),
    );
    cl.appendChild(row);
  });
  if (editable) {
    const row = document.createElement('div');
    row.className = 'cal-row closure add-row';
    const start = field('date', '', 'New closure first day', () => {});
    const end = field('date', '', 'New closure last day', () => {});
    const name = field('text', '', 'New closure name', () => {});
    name.placeholder = 'e.g. Christmas closure';
    const add = document.createElement('button');
    add.className = 'small';
    add.textContent = 'Add';
    add.addEventListener('click', () => {
      if (!ISO_DATE.test(start.value) || !ISO_DATE.test(end.value)) { toast('Pick the first and last day of the closure.'); return; }
      if (end.value < start.value) { toast('A closure must end on or after the day it starts.'); return; }
      cal.closures.push({ start: start.value, end: end.value, name: name.value.trim() || 'Closure' });
      calendarChanged();
    });
    row.append(start, end, name, add);
    cl.appendChild(row);
  } else if (!cl.children.length) {
    cl.appendChild(textRow('', 'None listed', false));
  }
}

function renderTimeline() {
  const inner = $('timelineInner');
  inner.innerHTML = '';
  const WEEKS_TOTAL = getTimelineHorizon();
  const totalWeeks = WEEKS_TOTAL + 1;
  const weekWidth = 100 / totalWeeks;
  inner.style.minWidth = (totalWeeks * 22) + 'px';

  const goTo = (el, week) => el.addEventListener('click', e => { e.stopPropagation(); setWeek(week); });

  // Month markers
  const monthsSeen = new Set();
  for (let i = 0; i < totalWeeks; i++) {
    const d = weekStartDate(i);
    const monthKey = d.getFullYear() + '-' + d.getMonth();
    if (!monthsSeen.has(monthKey)) {
      monthsSeen.add(monthKey);
      const m = document.createElement('div');
      m.className = 'timeline-month';
      m.style.left = (i * weekWidth) + '%';
      m.style.width = weekWidth + '%';
      m.textContent = d.toLocaleDateString('en-AU', { month: 'short' }) + (d.getMonth() === 0 ? ' ' + d.getFullYear() : '');
      inner.appendChild(m);
    }
  }

  const scn = currentScn();
  let rowIdx = 0;

  const sortedCohorts = [...scn.cohorts].sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));
  sortedCohorts.forEach(cohort => {
    const startWeek = weekIndexFromDate(parseDate(cohort.startDate));
    const end = cohortEndDate(cohort);
    if (!end) return;
    const endWeek = weekIndexFromDate(end);
    if (endWeek < 0 || startWeek > WEEKS_TOTAL) return;

    const top = (24 + rowIdx * 22) + 'px';

    // One segment per level: Level 1 then Level 2
    const spans = cohortLevelSpans(cohort);
    [1, 2].forEach(level => {
      const span = spans[level];
      if (!span) return;
      const segStart = level === 1 ? startWeek : weekIndexFromDate(span.start);
      const segEnd = level === 2 ? endWeek : Math.min(weekIndexFromDate(span.end), spans[2] ? weekIndexFromDate(spans[2].start) - 1 : endWeek);
      const visibleStart = Math.max(0, segStart);
      const visibleEnd = Math.min(WEEKS_TOTAL, segEnd);
      if (visibleEnd < visibleStart) return;
      const bar = document.createElement('div');
      bar.className = 'cohort-bar level-' + level;
      bar.style.left = (visibleStart * weekWidth) + '%';
      bar.style.width = ((visibleEnd - visibleStart + 1) * weekWidth) + '%';
      bar.style.top = top;
      bar.textContent = level === 1 ? `C${cohort.number} · L1` : 'L2';
      bar.title = `Cohort ${cohort.number} · Level ${level} · ${shortDate(span.start)} → ${longDate(span.end)}`;
      goTo(bar, visibleStart);
      inner.appendChild(bar);
    });

    // Admin week bar — one week immediately after the cohort ends
    const adminWeek = endWeek + 1;
    if (adminWeek <= WEEKS_TOTAL) {
      const adminBar = document.createElement('div');
      adminBar.className = 'cohort-bar admin-week';
      adminBar.style.left = (adminWeek * weekWidth) + '%';
      adminBar.style.width = weekWidth + '%';
      adminBar.style.top = top;
      adminBar.textContent = 'Admin';
      adminBar.title = `Admin week after Cohort ${cohort.number} · ${formatWeekLabel(adminWeek)}`;
      goTo(adminBar, adminWeek);
      inner.appendChild(adminBar);
    }
    rowIdx++;
  });

  const ongoingSorted = [...scn.ongoing].sort((a, b) => (a.type === 'l3' ? 0 : 1) - (b.type === 'l3' ? 0 : 1));
  ongoingSorted.forEach(ong => {
    const startWeek = weekIndexFromDate(parseDate(ong.startDate));
    const endWeek = ong.endDate ? weekIndexFromDate(parseDate(ong.endDate)) : WEEKS_TOTAL;
    if (endWeek < 0 || startWeek > WEEKS_TOTAL) return;

    const visibleStart = Math.max(0, startWeek);
    const visibleEnd = Math.min(WEEKS_TOTAL, endWeek);

    const bar = document.createElement('div');
    bar.className = 'cohort-bar ' + ong.type;
    bar.style.left = (visibleStart * weekWidth) + '%';
    bar.style.width = ((visibleEnd - visibleStart + 1) * weekWidth) + '%';
    bar.style.top = (24 + rowIdx * 22) + 'px';
    const ts = ong.type === 'l3' ? TIMESLOTS.find(t => t.id === ong.timeslotId) : null;
    bar.textContent = ts ? `${ong.name} · ${ts.short}` : ong.name;
    bar.title = `${ong.name} · ${formatWeekLabel(startWeek)} → ${ong.endDate ? formatWeekLabel(endWeek) : 'ongoing'}`;
    goTo(bar, visibleStart);
    inner.appendChild(bar);
    rowIdx++;
  });

  // Today marker
  const tw = todayWeekIdx();
  if (tw >= 0 && tw <= WEEKS_TOTAL) {
    const dayOffset = Math.min(4, (new Date().getDay() + 6) % 7) / 5;
    const today = document.createElement('div');
    today.className = 'timeline-today';
    today.style.left = ((tw + dayOffset) * weekWidth) + '%';
    today.innerHTML = '<span>Today</span>';
    inner.appendChild(today);
  }

  // Selected week cursor
  const cursor = document.createElement('div');
  cursor.className = 'timeline-week-cursor';
  cursor.style.left = (state.currentWeek * weekWidth + weekWidth / 2) + '%';
  inner.appendChild(cursor);

  $('timelineGrid').style.height = Math.max(200, 24 + rowIdx * 22 + 24) + 'px';

  const slider = $('weekSlider');
  slider.max = WEEKS_TOTAL;
  slider.value = state.currentWeek;
}

function renderWeekDisplay() {

  $('prevWeekBtn').disabled = state.currentWeek <= 0;
  $('nextWeekBtn').disabled = state.currentWeek >= getTimelineHorizon();

  // Admin weeks: cohorts whose last session falls in the week before this one
  const adminFor = [];
  currentScn().cohorts.forEach(c => {
    const end = cohortEndDate(c);
    if (end && weekIndexFromDate(end) + 1 === state.currentWeek) adminFor.push(c.number);
  });

    ? ' <span class="override-badge">edited</span>'

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const editable = isEditable();
  const todayStr = formatDateISO(new Date());

  const monday = weekStartDate(state.currentWeek);
  const dayDates = {};
  DAYS.forEach((d, i) => { dayDates[d] = addDays(monday, i); });

  const corner = document.createElement('div');
  corner.className = 'grid-cell day-header';
  grid.appendChild(corner);

  DAYS.forEach(d => {
    const date = dayDates[d];
    const dateStr = formatDateISO(date);
    const hol = isHoliday(dateStr);
    const cell = document.createElement('div');
    cell.className = 'grid-cell day-header' + (hol ? ' holiday-header' : '') + (dateStr === todayStr ? ' today-header' : '');
    cell.innerHTML = d + '<div class="day-date">' + date.getDate() + ' ' + date.toLocaleDateString('en-AU', { month: 'short' }) + '</div>' + (hol ? '<div class="day-date">' + esc(hol.name) + '</div>' : '');
    grid.appendChild(cell);
  });

  const allActs = getWeekActivities(state.currentWeek);
  const overridden = hasOverride(state.currentWeek);

  PEOPLE.forEach(person => {
    SESSIONS.forEach((session, sIdx) => {
      if (sIdx === 0) {
        const label = document.createElement('div');
        label.className = 'grid-cell person-label ' + person;
        label.style.gridRow = 'span 2';
        label.textContent = personName(person);
        grid.appendChild(label);
      }

      DAYS.forEach(day => {
        const hol = isHoliday(formatDateISO(dayDates[day]));

        const cell = document.createElement('div');
        cell.className = 'grid-cell lane-' + person;
        if (hol) cell.classList.add('holiday-day');
        if (person === 'iain' && session === 'pm') cell.classList.add('lane-divider');

        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.person = person;
        slot.dataset.day = day;
        slot.dataset.session = session;

        const label = document.createElement('span');
        label.className = 'slot-label';
        label.textContent = session.toUpperCase();
        slot.appendChild(label);

        const activities = allActs.filter(a => a.person === person && a.day === day && a.session === session);

        if (activities.length === 0) {
          slot.classList.add('empty');
          if (editable) slot.addEventListener('click', () => openAddModal(person, day, session));
        } else {
          activities.forEach(act => {
            const idx = allActs.indexOf(act);
            const block = document.createElement('div');
            block.className = 'activity-block ' + act.type;
            if (act.isHoliday) block.classList.add('holiday');
            if (act.isMakeup) block.classList.add('makeup');
            const level = act.type === 'l3' ? 3 : (act.level || (act.moduleId ? moduleLevel(act.moduleId) : null));
            if (level === 1 || level === 2) block.dataset.level = level;

            const name = document.createElement('div');
            name.className = 'activity-name';
            name.textContent = act.cohort || ACTIVITY_LABELS[act.type] || act.type;
            block.appendChild(name);

            if (level) {
              const m = document.createElement('div');
              m.className = 'activity-module';
              const tag = document.createElement('span');
              tag.className = 'level-tag';
              tag.textContent = 'L' + level;
              m.append(tag, act.moduleName || (level === 3 ? 'Rolling intake' : ''));
              block.appendChild(m);
            } else if (act.cohort && ACTIVITY_LABELS[act.type] && act.cohort !== ACTIVITY_LABELS[act.type]) {
              const m = document.createElement('div');
              m.className = 'activity-module';
              m.textContent = ACTIVITY_LABELS[act.type];
              block.appendChild(m);
            }

            if (act.isHoliday) {
              const hTag = document.createElement('div');
              hTag.className = 'holiday-tag';
              hTag.textContent = '⚠ ' + (act.holidayName || 'Holiday');
              block.appendChild(hTag);
            }

            if (act.isMakeup) {
              const mTag = document.createElement('div');
              mTag.className = 'makeup-tag';
              mTag.textContent = '↪ Makeup' + (act.makeupFor ? ` (for ${act.makeupFor.name})` : '');
              block.appendChild(mTag);
            }

            if (editable && overridden) {
              block.classList.add('editable');
              const del = document.createElement('button');
              del.className = 'activity-delete';
              del.textContent = '×';
              del.setAttribute('aria-label', 'Remove from this week');
              del.addEventListener('click', e => {
                e.stopPropagation();
                removeActivity(state.currentWeek, idx);
                render();
              });
              block.appendChild(del);
              block.addEventListener('click', e => { e.stopPropagation(); openEditModal(idx); });
            } else if (editable) {
              block.title = 'Comes from a cohort or ongoing activity. Click an empty slot to start editing this week by hand.';
            }

            slot.appendChild(block);
          });
        }

        if (editable) {
          slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drop-target'); });
          slot.addEventListener('dragleave', () => slot.classList.remove('drop-target'));
          slot.addEventListener('drop', e => {
            e.preventDefault();
            slot.classList.remove('drop-target');
            const type = e.dataTransfer.getData('activity-type');
            if (type) openAddModal(person, day, session, type);
          });
        }

        // Two or more live sessions in one slot means someone is double-booked
        if (activities.filter(a => !a.isHoliday).length > 1) slot.classList.add('overload');

        cell.appendChild(slot);
        grid.appendChild(cell);
      });
    });
  });
}

function renderSummary() {
  const w = state.currentWeek;
  const iainHours = getDeliveryHours(w, 'iain');
  const neilHours = getDeliveryHours(w, 'neil');
  const iainTraining = getDeliveryHoursByType(w, 'iain', 'training');
  const iainWF = getDeliveryHoursByType(w, 'iain', 'wf');
  const iainAce = getDeliveryHoursByType(w, 'iain', 'ace');
  const iainL3 = getDeliveryHoursByType(w, 'iain', 'l3');
  const neilTraining = getDeliveryHoursByType(w, 'neil', 'training');
  const neilL3 = getDeliveryHoursByType(w, 'neil', 'l3');

  const activeCohorts = getActiveCohortsForWeek(w);
  const activeOngoing = getActiveOngoingForWeek(w);

  const neilWarn = neilHours > NEIL_MAX_HOURS;
  const iainWarn = iainHours > IAIN_MAX_HOURS;

  // Empty slots for Iain (admin / open time)
  let iainAdmin = 0;
  DAYS.forEach(d => SESSIONS.forEach(s => {
    if (getActivitiesAt(w, 'iain', d, s).length === 0) iainAdmin++;

  const allActive = [
    ...activeCohorts.map(c => `Cohort ${c.number}`),
    ...activeOngoing.map(o => o.name),

  const byLevel = { 1: 0, 2: 0, 3: 0 };
  activeCohorts.forEach(c => { byLevel[cohortLevelInWeek(c, w)] += Number(c.participants) || 0; });
  activeOngoing.filter(o => o.type === 'l3').forEach(o => { byLevel[3] += Number(o.participants) || 0; });
  const totalParticipants = byLevel[1] + byLevel[2] + byLevel[3];

  $('summary').innerHTML = `
    <div class="summary-block">
      <h4>Iain · Week total</h4>
      <div class="stat ${iainWarn ? 'warn' : ''}">${iainHours}h</div>
      <div class="detail">
        ${iainTraining > 0 ? `Level 1–2: ${iainTraining}h<br>` : ''}
        ${iainL3 > 0 ? `Level 3: ${iainL3}h<br>` : ''}
        ${iainWF > 0 ? `Work Foundations: ${iainWF}h<br>` : ''}
        ${iainAce > 0 ? `ACE: ${iainAce}h<br>` : ''}
        Admin / open: ${iainAdmin} session blocks
        ${iainWarn ? `<br><span class="warn-text">Above ${IAIN_MAX_HOURS}h threshold</span>` : ''}
      </div>
    </div>
    <div class="summary-block">
      <h4>Neil · Week total</h4>
      <div class="stat ${neilWarn ? 'warn' : ''}">${neilHours}h</div>
      <div class="detail">
        Level 1–2: ${neilTraining}h${neilL3 > 0 ? ` · Level 3: ${neilL3}h` : ''}<br>
        ${neilWarn ? `<span class="warn-text">Above ${NEIL_MAX_HOURS}h threshold</span>` : 'Within sustainable range'}
      </div>
    </div>
    <div class="summary-block">
      <h4>Active this week</h4>
      <div class="stat">${allActive.length}</div>
      <div class="detail">${allActive.map(esc).join('<br>') || 'Nothing scheduled'}</div>
    </div>
    <div class="summary-block">
      <h4>Participants in training</h4>
      <div class="stat">${totalParticipants}</div>
      <div class="detail">Level 1: ${byLevel[1]} · Level 2: ${byLevel[2]} · Level 3: ${byLevel[3]}</div>
    </div>
  `;
}

let editingIdx = null;
let pendingSlot = null;

function openAddModal(person, day, session, presetType = null) {
  if (!isEditable()) return;
  editingIdx = null;
  pendingSlot = { person, day, session };
  $('modalTitle').textContent = `Add activity · ${personName(person)} · ${day} ${session.toUpperCase()}`;
  $('activityTypeSelect').value = presetType || 'training';
  $('cohortInput').value = '';
  $('modal').classList.add('active');
  $('cohortInput').focus();
}

function openEditModal(idx) {
  const act = getWeekActivities(state.currentWeek)[idx];
  if (!act) return;
  editingIdx = idx;
  pendingSlot = null;
  $('modalTitle').textContent = 'Edit activity';
  $('activityTypeSelect').value = ACTIVITY_LABELS[act.type] ? act.type : 'training';
  $('cohortInput').value = act.cohort || '';
  $('modal').classList.add('active');
}

function closeModal() {
  $('modal').classList.remove('active');
  editingIdx = null;
  pendingSlot = null;
}

let editingCohortId = null;
let selectedTimeslot = null;

function openCohortForm(cohortId = null) {
  editingCohortId = cohortId;
  const scn = currentScn();
  $('cohortFormTitle').textContent = cohortId ? 'Edit Level 1–2 cohort' : 'New Level 1–2 cohort';

  const existing = scn.cohorts.map(c => c.number).filter(n => !isNaN(n));
  const nextNum = existing.length > 0 ? Math.max(...existing) + 1 : 10;
  const c = cohortId ? scn.cohorts.find(c => c.id === cohortId) : null;
  if (cohortId && !c) return;

  $('cohortNumberInput').value = c ? c.number : nextNum;
  $('cohortStartInput').value = c ? c.startDate : '';
  $('cohortParticipantsInput').value = c ? c.participants : 6;
  selectedTimeslot = c ? c.timeslotId : null;
  $('facilitatorPerDay').innerHTML = '';
  refreshCohortSlots(c ? (c.facilitators || null) : null, c ? c.facilitator : null);

  $('cohortFormModal').classList.add('active');
}

function renderFacilitatorPerDay(fieldId, containerId, timeslotId, existingFacilitators, fallbackFacilitator) {
  const field = $(fieldId);
  const container = $(containerId);
  const slot = TIMESLOTS.find(t => t.id === timeslotId);
  if (!slot) { field.hidden = true; return; }

  field.hidden = false;
  container.innerHTML = '';

  slot.days.forEach(day => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 12px;';

    const lbl = document.createElement('label');
    lbl.textContent = day;
    lbl.htmlFor = containerId + '-' + day;
    lbl.style.cssText = 'font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink); font-family: var(--font-body); margin: 0;';
    wrap.appendChild(lbl);

    const sel = document.createElement('select');
    sel.id = containerId + '-' + day;
    sel.dataset.day = day;
    sel.innerHTML = '<option value="iain">Iain</option><option value="neil">Neil</option>';
    sel.value = (existingFacilitators && existingFacilitators[day]) || fallbackFacilitator || 'iain';
    wrap.appendChild(sel);
    container.appendChild(wrap);
  });
}

function readFacilitatorSelections(containerId = 'facilitatorPerDay') {
  const out = {};
  document.querySelectorAll('#' + containerId + ' select').forEach(s => { out[s.dataset.day] = s.value; });
  return out;
}

// Draws the six timeslot buttons. A slot is unavailable when a cohort or Level 3 group
// already holds one of its day/sessions over the dates being planned. Returns the
// selection that is still valid (null if the chosen slot is now taken).
function renderSlotPicker({ containerId, selected, startStr, endFor, excludeId, onPick }) {
  const el = $(containerId);
  el.innerHTML = '';
  if (!startStr) {
    const hint = document.createElement('div');
    hint.className = 'slot-hint';
    hint.textContent = 'Choose a start date to see which timeslots are free.';
    el.appendChild(hint);
    return selected;
  }
  const start = parseDate(startStr);
  let stillSelected = selected;

  TIMESLOTS.forEach(slot => {
    const blockers = slotBlockers(slot.id, start, endFor(slot.id), excludeId);
    const taken = blockers.length > 0;
    if (taken && selected === slot.id) stillSelected = null;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'timeslot-btn' + (taken ? ' taken' : '') + (!taken && selected === slot.id ? ' selected' : '');
    btn.disabled = taken;
    btn.setAttribute('aria-pressed', !taken && selected === slot.id ? 'true' : 'false');

    let takenLabel = '';
    if (taken) {
      const b = blockers[0];
      const partial = b.sharedDays.length < b.ts.days.length ? ' ' + b.sharedDays.join('/') : '';
      takenLabel = `● ${esc(b.label)}${partial} (${b.end ? 'until ' + shortDate(b.end) : 'ongoing'})`;
    }
    btn.innerHTML = `
      <div class="ts-label">${slot.days[0]} / ${slot.days[1]} ${slot.session.toUpperCase()}</div>
      <div class="ts-time">${slot.time}</div>
      ${takenLabel ? `<div class="ts-taken">${takenLabel}</div>` : ''}
    `;
    if (!taken) btn.addEventListener('click', () => onPick(slot.id));
    el.appendChild(btn);
  });
  return stillSelected;
}

function refreshCohortSlots(facilitators = null, fallback = null) {
  const startStr = $('cohortStartInput').value;
  const existing = facilitators || readFacilitatorSelections('facilitatorPerDay');
  selectedTimeslot = renderSlotPicker({
    containerId: 'timeslotButtons',
    selected: selectedTimeslot,
    startStr,
    excludeId: editingCohortId,
    endFor: tsId => {
      const sessions = generateSchedule(startStr, tsId);
      return sessions.length ? parseDate(sessions[sessions.length - 1].dateStr) : parseDate(startStr);
    },
    onPick: tsId => { selectedTimeslot = tsId; refreshCohortSlots(); },
  });
  if (selectedTimeslot && startStr) renderFacilitatorPerDay('facilitatorsField', 'facilitatorPerDay', selectedTimeslot, existing, fallback);
  else $('facilitatorsField').hidden = true;
}

// ============================================================================
// LEVEL 3 GROUPS
// ============================================================================
// Stored with the ongoing activities (type 'l3') so they flow into every week,
// but each one holds a whole training timeslot like a cohort does.

let editingL3Id = null;
let selectedL3Timeslot = null;

function openL3Form(id = null) {
  editingL3Id = id;
  const g = id ? currentScn().ongoing.find(o => o.id === id) : null;
  if (id && !g) return;
  $('l3FormTitle').textContent = g ? 'Edit Level 3 group' : 'New Level 3 group';
  $('l3NameInput').value = g ? g.name : 'Level 3';
  $('l3ParticipantsInput').value = g ? g.participants : 6;
  $('l3StartInput').value = g ? g.startDate : '';
  $('l3EndInput').value = g ? (g.endDate || '') : '';
  selectedL3Timeslot = g ? g.timeslotId : null;
  $('l3FacilitatorPerDay').innerHTML = '';
  refreshL3Slots(g ? (g.facilitators || null) : null);
  $('l3FormModal').classList.add('active');
}

function refreshL3Slots(facilitators = null) {
  const startStr = $('l3StartInput').value;
  const endStr = $('l3EndInput').value;
  const existing = facilitators || readFacilitatorSelections('l3FacilitatorPerDay');
  selectedL3Timeslot = renderSlotPicker({
    containerId: 'l3TimeslotButtons',
    selected: selectedL3Timeslot,
    startStr,
    excludeId: editingL3Id,
    endFor: () => (endStr ? parseDate(endStr) : null),
    onPick: tsId => { selectedL3Timeslot = tsId; refreshL3Slots(); },
  });
  if (selectedL3Timeslot && startStr) renderFacilitatorPerDay('l3FacilitatorsField', 'l3FacilitatorPerDay', selectedL3Timeslot, existing, 'neil');
  else $('l3FacilitatorsField').hidden = true;
}

function saveL3Form() {
  const name = $('l3NameInput').value.trim() || 'Level 3';
  const participants = parseInt($('l3ParticipantsInput').value) || 0;
  const startDate = $('l3StartInput').value;
  const endDate = $('l3EndInput').value || null;

  if (!startDate || !selectedL3Timeslot) {
    toast('Choose a start date and a timeslot.');
    return;
  }
  if (endDate && endDate < startDate) {
    toast('The end date is before the start date.');
    return;
  }

  const ts = TIMESLOTS.find(t => t.id === selectedL3Timeslot);
  const facilitators = readFacilitatorSelections('l3FacilitatorPerDay');
  const group = {
    name, type: 'l3', startDate, endDate, participants,
    timeslotId: ts.id,
    facilitators,
    facilitator: facilitators[ts.days[0]] || 'neil',
    slots: ts.days.map(day => ({ day, session: ts.session })),
  };

  const scn = currentScn();
  if (editingL3Id) {
    const idx = scn.ongoing.findIndex(o => o.id === editingL3Id);
    if (idx >= 0) scn.ongoing[idx] = { ...scn.ongoing[idx], ...group };
  } else {
    scn.ongoing.push({ id: 'l3-' + Date.now(), ...group });
  }

  commit();
  $('l3FormModal').classList.remove('active');
  render();
}

async function deleteCohort(id) {
  const scn = currentScn();
  const cohort = scn.cohorts.find(c => c.id === id);
  if (!cohort) return;
  if (!(await askConfirm(`Delete Cohort ${cohort.number}?`, 'Its sessions are removed from every week of this scenario.', 'Delete', true))) return;
  scn.cohorts = scn.cohorts.filter(c => c.id !== id);
  commit();
  render();
}

// Timeslots available for rolling generation (Tue/Thu slots are being phased out)
const ROLLING_TIMESLOT_IDS = ['mw-am', 'mw-pm', 'wf-am', 'wf-pm'];

function openAutoFillModal() {
  const scn = currentScn();
  const container = $('autoFillSlots');
  container.innerHTML = '';

  ROLLING_TIMESLOT_IDS.forEach(tsId => {
    const ts = TIMESLOTS.find(t => t.id === tsId);
    if (!ts) return;

    const latest = scn.cohorts
      .filter(c => c.timeslotId === tsId && c.sessions.length > 0)
      .sort((a, b) => cohortEndDate(b) - cohortEndDate(a))[0];

    // An open-ended Level 3 group on this slot means no new cohorts fit there
    const today = getMondayOf(new Date());
    const l3Here = slotBlockers(tsId, today, null, null).filter(b => b.kind === 'l3');
    const l3Open = l3Here.find(b => !b.end);

    const wrap = document.createElement('label');
    wrap.className = 'check-tile';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'autofill-' + tsId;
    cb.dataset.timeslotId = tsId;
    cb.checked = !l3Open;
    cb.style.marginTop = '3px';
    wrap.appendChild(cb);

    const text = document.createElement('div');
    text.innerHTML = `
      <div class="tile-title">${ts.days[0]} / ${ts.days[1]} ${ts.session.toUpperCase()}</div>
      <div class="tile-sub">${latest ? `Continues from Cohort ${esc(latest.number)} (ends ${longDate(cohortEndDate(latest))})` : 'No existing cohort · starts fresh'}</div>
      ${l3Here.length ? `<div class="tile-sub" style="color: var(--l3);">Held by ${esc(l3Here[0].label)} from ${shortDate(l3Here[0].start)}${l3Here[0].end ? ' to ' + shortDate(l3Here[0].end) : ', ongoing'}</div>` : ''}
    `;
    wrap.appendChild(text);
    container.appendChild(wrap);
  });

  const existingNums = scn.cohorts.map(c => c.number).filter(n => !isNaN(n));
  $('autoFillStartNum').value = existingNums.length > 0 ? Math.max(...existingNums) + 1 : 16;
  $('autoFillEndDate').value = formatDateISO(addDays(new Date(), 365));
  $('autoFillFacilitator').value = 'neil';
  $('autoFillParticipants').value = 6;
  $('autoFillModal').classList.add('active');
}

// Next cohort start: the week after the last session is the admin week, so the
// new cohort starts on the slot's first day in the week after that.
function computeNextCohortStart(lastSessionDate, timeslot) {
  const newCohortWeekMon = addDays(getMondayOf(lastSessionDate), 14);
  return firstSlotDayFrom(newCohortWeekMon, timeslot);
}

function firstSlotDayFrom(monday, timeslot) {
  const dayIndices = timeslot.days.map(d => DAY_INDEX[d]);
  for (let i = 0; i < 5; i++) {
    if (dayIndices.includes(i)) return formatDateISO(addDays(monday, i));
  }
  return formatDateISO(monday);
}

async function runAutoFill() {
  const scn = currentScn();
  const selectedSlots = Array.from(document.querySelectorAll('#autoFillSlots input[type="checkbox"]:checked')).map(cb => cb.dataset.timeslotId);

  if (selectedSlots.length === 0) { toast('Select at least one timeslot to fill.'); return; }

  const startNum = parseInt($('autoFillStartNum').value);
  const endDateStr = $('autoFillEndDate').value;
  const facilitator = $('autoFillFacilitator').value;
  const participants = parseInt($('autoFillParticipants').value) || 6;

  if (!startNum || !endDateStr) { toast('Set a starting cohort number and an end date.'); return; }

  const horizonEnd = parseDate(endDateStr);
  const newCohorts = [];

  selectedSlots.forEach(tsId => {
    const ts = TIMESLOTS.find(t => t.id === tsId);
    if (!ts) return;

    let latestEnd = null;
    scn.cohorts.filter(c => c.timeslotId === tsId).forEach(c => {
      const d = cohortEndDate(c);
      if (d && (!latestEnd || d > latestEnd)) latestEnd = d;
    });

    let nextStartStr = latestEnd
      ? computeNextCohortStart(latestEnd, ts)
      : firstSlotDayFrom(addDays(getMondayOf(new Date()), 7), ts);

    for (let safety = 0; safety < 30; safety++) {
      if (parseDate(nextStartStr) > horizonEnd) break;
      const sessions = generateSchedule(nextStartStr, tsId);
      if (sessions.length === 0) break;

      // Skip past any Level 3 group holding this slot; stop if one runs with no end
      const l3 = slotBlockers(tsId, parseDate(nextStartStr), parseDate(sessions[sessions.length - 1].dateStr), null).filter(b => b.kind === 'l3');
      if (l3.length) {
        if (l3.some(b => !b.end)) break;
        const lastEnd = new Date(Math.max(...l3.map(b => b.end)));
        nextStartStr = firstSlotDayFrom(addDays(getMondayOf(lastEnd), 7), ts);
        continue;
      }

      const facilitatorsObj = {};
      ts.days.forEach(d => { facilitatorsObj[d] = facilitator; });

      newCohorts.push({
        id: 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        number: null, // assigned after sorting
        startDate: nextStartStr,
        participants,
        facilitators: facilitatorsObj,
        timeslotId: tsId,
        sessions,
      });

      nextStartStr = computeNextCohortStart(parseDate(sessions[sessions.length - 1].dateStr), ts);
    }
  });

  if (newCohorts.length === 0) {
    toast('No cohorts fit before the end date. Pick a later end date or other timeslots.', 5000);
    return;
  }

  // Number chronologically across all slots
  newCohorts.sort((a, b) => parseDate(a.startDate) - parseDate(b.startDate));
  newCohorts.forEach((c, i) => { c.number = startNum + i; });
  const lastNum = startNum + newCohorts.length - 1;

  const includeWF = $('autoFillIncludeWF').checked;
  const hasWF = scn.ongoing.some(o => o.type === 'wf');
  const willCreateWF = includeWF && !hasWF;
  const wfMsg = willCreateWF ? '\nAlso adds Work Foundations as an ongoing activity.'
    : (includeWF && hasWF ? '\nWork Foundations already exists, so it is not added again.' : '');

  const ok = await askConfirm(
    `Add ${newCohorts.length} cohort${newCohorts.length !== 1 ? 's' : ''}?`,
    `Cohort ${startNum} through ${lastNum}, up to ${longDate(horizonEnd)}.${wfMsg}`,
    'Add cohorts'
  );
  if (!ok) return;

  scn.cohorts.push(...newCohorts);

  if (willCreateWF) {
    scn.ongoing.push({
      id: 'o-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      name: 'Work Foundations',
      type: 'wf',
      startDate: formatDateISO(new Date()),
      endDate: null,
      facilitator: 'iain',
      slots: ['Wed', 'Thu', 'Fri'].flatMap(day => SESSIONS.map(session => ({ day, session }))),
    });
  }

  commit();
  $('autoFillModal').classList.remove('active');
  render();
}

  $('ongoingFormModal').classList.add('active');

async function exportScenario() {
  const payload = {
    format: 'workload-planner-scenario',
    version: 2,
    exportedAt: new Date().toISOString(),
    name: state.currentScenario,
    data: currentScn(),
  };
  const text = JSON.stringify(payload, null, 2);
  const filename = 'workload_' + state.currentScenario.replace(/[^a-z0-9\-_]+/gi, '_') + '.json';

  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function importScenarioFile(file) {
  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch (err) {
    toast('That file is not valid JSON. Choose a file made with Export.', 5000);
    return;
  }
  if (!parsed || parsed.format !== 'workload-planner-scenario' || !parsed.data || !parsed.name) {
    toast('That file is not a workload planner scenario. Choose a file made with Export.', 5000);
    return;
  }

  let importName = String(parsed.name);
  if (state.scenarios[importName]) {
    const choice = await askChoice(
      `"${importName}" already exists`,
      'Replace the existing scenario with the imported one, or keep both?',
      [
        { label: 'Cancel', value: null },
        { label: 'Keep both', value: 'copy' },
        { label: 'Replace', value: 'replace', kind: 'warn' },
      ]
    );
    if (!choice) return;
    if (choice === 'copy') importName = importName + ' (imported ' + new Date().toLocaleDateString('en-AU') + ')';
  }

  const data = normalizeScenario(parsed.data);
  // Imported files may predate the current holiday data; rebuild their sessions.
  data.cohorts.forEach(c => { if (c.startDate && c.timeslotId) c.sessions = generateSchedule(c.startDate, c.timeslotId); });

  state.scenarios[importName] = data;
  state.currentScenario = importName;
  commit();
  saveView();
  render();
  toast(`Imported "${importName}".` + (mode === 'edit' ? ' Publish to share it with the team.' : ''));
}

// ============================================================================
// EVENT WIRING
// ============================================================================

function setPanelCollapsed(name, collapsed) {
  $(name + 'Panel').classList.toggle('collapsed', collapsed);
  $(name + 'PanelToggle').textContent = collapsed ? '▶' : '▼';
  $(name + 'PanelHeader').setAttribute('aria-expanded', collapsed ? 'false' : 'true');
}

function wireEvents() {
  // Slot activity modal
  $('modalCancel').addEventListener('click', closeModal);
  $('modalSave').addEventListener('click', () => {
    const type = $('activityTypeSelect').value;
    const cohort = $('cohortInput').value.trim();
    if (editingIdx !== null) {
      updateActivity(state.currentWeek, editingIdx, { type, cohort });
    } else if (pendingSlot) {
      addActivity(state.currentWeek, { ...pendingSlot, type, cohort, source: 'manual' });
    }
    closeModal();
    render();
  });

  // Cohort form
  $('addCohortBtn').addEventListener('click', () => openCohortForm());
  $('cohortStartInput').addEventListener('change', () => refreshCohortSlots());

  // Level 3 form
  $('addL3Btn').addEventListener('click', () => openL3Form());
  $('l3StartInput').addEventListener('change', () => refreshL3Slots());
  $('l3EndInput').addEventListener('change', () => refreshL3Slots());
  $('l3FormCancel').addEventListener('click', () => $('l3FormModal').classList.remove('active'));
  $('l3FormSave').addEventListener('click', saveL3Form);
  $('cohortFormCancel').addEventListener('click', () => $('cohortFormModal').classList.remove('active'));
  $('cohortFormSave').addEventListener('click', () => {
    const number = parseInt($('cohortNumberInput').value);
    const startDate = $('cohortStartInput').value;
    const participants = parseInt($('cohortParticipantsInput').value) || 0;

    if (!number || !startDate || !selectedTimeslot) {
      toast('Fill in the cohort number and start date, and choose a timeslot.');
      return;
    }

    const facilitators = readFacilitatorSelections('facilitatorPerDay');
    const sessions = generateSchedule(startDate, selectedTimeslot);
    const scn = currentScn();

    if (editingCohortId) {
      const idx = scn.cohorts.findIndex(c => c.id === editingCohortId);
      if (idx >= 0) {
        scn.cohorts[idx] = { ...scn.cohorts[idx], number, startDate, participants, facilitators, timeslotId: selectedTimeslot, sessions };
        delete scn.cohorts[idx].facilitator; // older single-facilitator field
      }
    } else {
      scn.cohorts.push({ id: 'c-' + Date.now(), number, startDate, participants, facilitators, timeslotId: selectedTimeslot, sessions });
    }

    commit();
    $('cohortFormModal').classList.remove('active');
    render();
  });

  // Auto-fill
  $('autoFillBtn').addEventListener('click', openAutoFillModal);
  $('autoFillCancel').addEventListener('click', () => $('autoFillModal').classList.remove('active'));
  $('autoFillRun').addEventListener('click', runAutoFill);

  // Ongoing form
  $('addOngoingBtn').addEventListener('click', () => openOngoingForm());
  $('ongoingFormCancel').addEventListener('click', () => $('ongoingFormModal').classList.remove('active'));
  $('ongoingFormSave').addEventListener('click', () => {
    const name = $('ongoingNameInput').value.trim();
    const type = $('ongoingTypeSelect').value;
    const startDate = $('ongoingStartInput').value;
    const endDate = $('ongoingEndInput').value || null;
    const facilitator = $('ongoingFacilitatorSelect').value;
    const slots = Array.from(document.querySelectorAll('#ongoingDaysGrid input[type="checkbox"]:checked'))
      .map(cb => ({ day: cb.dataset.day, session: cb.dataset.session }));

    if (!name || !startDate || slots.length === 0) {
      toast('Fill in the name and start date, and tick at least one day and session.');
      return;
    }
    if (endDate && endDate < startDate) {
      toast('The end date is before the start date.');
      return;
    }

    const scn = currentScn();
    if (editingOngoingId) {
      const idx = scn.ongoing.findIndex(o => o.id === editingOngoingId);
      if (idx >= 0) scn.ongoing[idx] = { ...scn.ongoing[idx], name, type, startDate, endDate, facilitator, slots };
    } else {
      scn.ongoing.push({ id: 'o-' + Date.now(), name, type, startDate, endDate, facilitator, slots });
    }

    commit();
    $('ongoingFormModal').classList.remove('active');
    render();
  });

  // Scenarios
  $('scenarioSelect').addEventListener('change', e => {
    state.currentScenario = e.target.value;
    saveView();
    render();
  });

  $('saveAsBtn').addEventListener('click', () => {
    $('saveAsInput').value = '';
    $('saveAsModal').classList.add('active');
    $('saveAsInput').focus();
  });
  $('saveAsCancel').addEventListener('click', () => $('saveAsModal').classList.remove('active'));
  $('saveAsConfirm').addEventListener('click', () => {
    const name = $('saveAsInput').value.trim();
    if (!name) { toast('Give the scenario a name.'); return; }
    if (state.scenarios[name]) { toast(`A scenario called "${name}" already exists. Choose another name.`); return; }
    state.scenarios[name] = structuredClone(currentScn());
    state.currentScenario = name;
    commit();
    saveView();
    $('saveAsModal').classList.remove('active');
    render();
  });
  $('saveAsInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveAsConfirm').click(); });

  $('deleteBtn').addEventListener('click', async () => {
    if (state.currentScenario === 'Current state') {
      toast('"Current state" is the main plan and cannot be deleted.');
      return;
    }
    if (!(await askConfirm(`Delete scenario "${state.currentScenario}"?`, 'Its cohorts, activities and weekly edits are removed.', 'Delete', true))) return;
    delete state.scenarios[state.currentScenario];
    state.currentScenario = 'Current state';
    commit();
    saveView();
    render();
  });

  $('clearAllBtn').addEventListener('click', async () => {
    const scn = currentScn();
    const count = Object.keys(scn.overrides).length;
    if (count === 0) { toast('No weeks have been edited by hand in this scenario.'); return; }
    if (!(await askConfirm('Clear hand edits?', `${count} edited week${count !== 1 ? 's go' : ' goes'} back to what the cohorts and ongoing activities produce.`, 'Clear edits', true))) return;
    scn.overrides = {};
    commit();
    render();
  });

  $('exportBtn').addEventListener('click', exportScenario);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (file) importScenarioFile(file);
  });

  // Collapsible panels
  ['cohort', 'holiday'].forEach(name => {
    const toggle = () => {
      setPanelCollapsed(name, !$(name + 'Panel').classList.contains('collapsed'));
      saveView();
    };
    $(name + 'PanelHeader').addEventListener('click', toggle);
    $(name + 'PanelHeader').addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
  $('showPastHolidaysBtn').addEventListener('click', () => {
    showPastHolidays = !showPastHolidays;
    renderCalendar();
  });

  // Week navigation
  $('weekSlider').addEventListener('input', e => setWeek(parseInt(e.target.value)));
  $('prevWeekBtn').addEventListener('click', () => setWeek(state.currentWeek - 1));
  $('nextWeekBtn').addEventListener('click', () => setWeek(state.currentWeek + 1));
  $('todayWeekBtn').addEventListener('click', () => setWeek(todayWeekIdx()));

  $('timelineGrid').addEventListener('click', e => {
    const rect = $('timelineInner').getBoundingClientRect();
    const WEEKS_TOTAL = getTimelineHorizon();
    const week = Math.floor(((e.clientX - rect.left) / rect.width) * (WEEKS_TOTAL + 1));
    if (week >= 0 && week <= WEEKS_TOTAL) setWeek(week);
  });

  // Palette drag
  document.querySelectorAll('.palette-item').forEach(item => {
    item.addEventListener('dragstart', e => e.dataTransfer.setData('activity-type', item.dataset.type));
  });

  // Escape closes the open form; clicking the backdrop does too
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    if (overlay.id === 'confirmModal') return;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.modal-overlay.active').forEach(o => { if (o.id !== 'confirmModal') o.classList.remove('active'); });
  });
}

// ============================================================================
// INIT
// ============================================================================

$('app').appendChild($('appTemplate').content.cloneNode(true));
wireEvents();
loadView();
initHosting();
</script>
</body>
</html>
