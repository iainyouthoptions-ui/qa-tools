<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workload Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style id="plannerStyle">
/* Layout: status strip, cohort list, full-width timeline, then palette + weekly two-lane grid, then week summary. */
:root {
  --bg: #f5f3ee;
  --bg-panel: #ffffff;
  --bg-sunken: #ebe8e0;
  --ink: #1c1c1a;
  --ink-soft: #56544c;
  --ink-faint: #8c8a82;
  --rule: #d8d4ca;
  --rule-soft: #e8e4d9;
  --accent: #2d4a3e;
  --accent-soft: #d6e2d8;
  --warn: #9a2a2a;
  --warn-soft: #f4dcdc;
  --warn-stripe: rgba(154, 42, 42, 0.05);
  --neil: #6b4e2e;
  --neil-soft: #e8dcc8;
  --iain: #2d4a3e;
  --iain-soft: #d6e2d8;
  --iain-lane: rgba(45, 74, 62, 0.04);
  --neil-lane: rgba(107, 78, 46, 0.05);
  --iain-label: rgba(45, 74, 62, 0.1);
  --neil-label: rgba(107, 78, 46, 0.1);
  --wf: #8a6a3a;
  --wf-soft: #efe4d4;
  --wf-ink: #5e4720;
  --ace: #6a3e6a;
  --ace-soft: #e8dde8;
  --l1: #1a6f98;  --l1-soft: #dcebf3;  /* Level 1: modules 1–2 */
  --l2: #4b4fa0;  --l2-soft: #e3e3f4;  /* Level 2: modules 3–5 */
  --l3: #a8501f;  --l3-soft: #f6e3d6;  /* Level 3: ongoing, rolling intake */
  --scrim: rgba(28, 28, 26, 0.4);
  --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191a17; --bg-panel: #22231f; --bg-sunken: #2b2c27;
    --ink: #ecebe4; --ink-soft: #b8b5a9; --ink-faint: #8a877b;
    --rule: #3c3d36; --rule-soft: #30312b;
    --accent: #8fbfa6; --accent-soft: #24382f;
    --warn: #e88f8f; --warn-soft: #3f2323; --warn-stripe: rgba(232, 143, 143, 0.07);
    --neil: #d4ae80; --neil-soft: #3a2e20;
    --iain: #8fbfa6; --iain-soft: #24382f;
    --iain-lane: rgba(143, 191, 166, 0.05); --neil-lane: rgba(212, 174, 128, 0.05);
    --iain-label: rgba(143, 191, 166, 0.12); --neil-label: rgba(212, 174, 128, 0.12);
    --wf: #c9a26a; --wf-soft: #352c1e; --wf-ink: #e3c79c;
    --ace: #c99bc9; --ace-soft: #33263a;
    --l1: #6cb8de; --l1-soft: #1b3140;
    --l2: #9da1e6; --l2-soft: #282a48;
    --l3: #e59266; --l3-soft: #3d2618;
    --scrim: rgba(0, 0, 0, 0.55);
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191a17; --bg-panel: #22231f; --bg-sunken: #2b2c27;
  --ink: #ecebe4; --ink-soft: #b8b5a9; --ink-faint: #8a877b;
  --rule: #3c3d36; --rule-soft: #30312b;
  --accent: #8fbfa6; --accent-soft: #24382f;
  --warn: #e88f8f; --warn-soft: #3f2323; --warn-stripe: rgba(232, 143, 143, 0.07);
  --neil: #d4ae80; --neil-soft: #3a2e20;
  --iain: #8fbfa6; --iain-soft: #24382f;
  --iain-lane: rgba(143, 191, 166, 0.05); --neil-lane: rgba(212, 174, 128, 0.05);
  --iain-label: rgba(143, 191, 166, 0.12); --neil-label: rgba(212, 174, 128, 0.12);
  --wf: #c9a26a; --wf-soft: #352c1e; --wf-ink: #e3c79c;
  --ace: #c99bc9; --ace-soft: #33263a;
  --l1: #6cb8de; --l1-soft: #1b3140;
  --l2: #9da1e6; --l2-soft: #282a48;
  --l3: #e59266; --l3-soft: #3d2618;
  --scrim: rgba(0, 0, 0, 0.55);
  --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.4;
  padding-block: 24px;
  padding-inline: 24px;
  min-height: 100vh;
}

@media (max-width: 640px) {
  body { padding-block: 16px; padding-inline: 16px; }
}

.app { max-width: 1400px; margin: 0 auto; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Status strip */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 12px;
  margin-bottom: 20px;
  border: 1px solid var(--rule);
  border-radius: 4px;
  background: var(--bg-panel);
  font-size: 12px;
  color: var(--ink-soft);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink-faint);
  flex: none;
}
.status-bar[data-state="published"] .status-dot { background: var(--accent); }
.status-bar[data-state="dirty"] .status-dot { background: var(--warn); }
.status-bar[data-state="dirty"] #statusText { color: var(--warn); font-weight: 600; }
.status-spacer { flex: 1; }
.status-actions { display: flex; gap: 6px; flex-wrap: wrap; }

header {
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  flex-wrap: wrap;
}

.title-block h1 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1;
  margin-bottom: 6px;
}

.title-block .subtitle, .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.scenarios { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.scenarios label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-right: 4px;
}

select, button, input[type="text"], input[type="password"], input[type="number"], input[type="date"] {
  font-family: var(--font-body);
  font-size: 13px;
  background: var(--bg-panel);
  color: var(--ink);
  border: 1px solid var(--rule);
  padding: 7px 11px;
  border-radius: 3px;
  cursor: pointer;
}

input[type="text"], input[type="password"], input[type="number"], input[type="date"] { cursor: text; }

button { font-weight: 500; transition: background 0.15s, border-color 0.15s; }
button:hover:not(:disabled) { background: var(--bg-sunken); border-color: var(--ink-soft); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.primary:hover:not(:disabled) { background: var(--ink-soft); }
button.warn { color: var(--warn); border-color: var(--warn-soft); }
button.warn:hover:not(:disabled) { background: var(--warn-soft); }
button.small { padding: 4px 10px; font-size: 12px; }

/* Read-only view hides every editing affordance */
.app.readonly .edit-only { display: none !important; }

/* Section panels */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.panel-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
}
.panel-header.no-toggle { cursor: default; }
.panel-header h2 { font-family: var(--font-display); font-weight: 500; font-size: 17px; }
.panel-header .panel-meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
.panel-toggle { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
.panel-body { padding: 20px; }
.panel.collapsed .panel-body { display: none; }

@media (max-width: 640px) {
  .panel-body { padding: 14px; }
  .panel-header { padding: 12px 14px; }
}

/* Cohort management */
.cohort-list { display: flex; flex-direction: column; gap: 8px; }

.cohort-row {
  display: grid;
  grid-template-columns: auto 1fr auto auto auto;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-sunken);
  border-radius: 3px;
  border-left: 3px solid var(--rule);
}
.cohort-row > * { min-width: 0; }
.cohort-row.training { border-left-color: var(--l1); }
.cohort-row.l3 { border-left-color: var(--l3); }
.cohort-row.ace { border-left-color: var(--ace); }
.cohort-row.wf { border-left-color: var(--wf); }
.cohort-row.clash { border-left-color: var(--warn); }

@media (max-width: 760px) {
  .cohort-row { grid-template-columns: 1fr auto; }
  .cohort-row .cohort-detail-wrap, .cohort-row .cohort-warnings { grid-column: 1 / -1; }
}

.cohort-row .cohort-name { font-weight: 600; font-size: 14px; }
.cohort-row .cohort-detail { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
.cohort-row .cohort-stat {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.cohort-row .cohort-stat .value { color: var(--ink); font-weight: 600; }
.cohort-warnings { font-family: var(--font-mono); font-size: 11px; }
.cohort-warnings .clash-text { color: var(--warn); font-weight: 600; }
.cohort-warnings .holiday-text { color: var(--warn); }

.cohort-actions { display: flex; gap: 6px; }

.no-cohorts {
  padding: 28px 20px;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.6;
  border: 1px dashed var(--rule);
  border-radius: 4px;
  max-width: 68ch;
}
.no-cohorts strong { color: var(--ink); }

.add-buttons { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* Forms */
.form-row { display: grid; gap: 12px; margin-bottom: 12px; }
.form-row.cols-2 { grid-template-columns: 1fr 1fr; }
.form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 560px) {
  .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
}

.form-field label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  display: block;
  margin-bottom: 4px;
}
.form-field input, .form-field select { width: 100%; }

.timeslot-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
}

.timeslot-btn {
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--bg-panel);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 400;
}
.timeslot-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.timeslot-btn.taken { opacity: 0.45; cursor: not-allowed; }
.timeslot-btn .ts-label { font-weight: 600; font-size: 13px; }
.timeslot-btn .ts-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
.timeslot-btn .ts-taken { font-size: 10px; color: var(--ink-faint); margin-top: 4px; }

.check-tile {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 3px;
  cursor: pointer;
}
.check-tile .tile-title { font-weight: 600; font-size: 13px; }
.check-tile .tile-sub { font-size: 11px; color: var(--ink-faint); font-family: var(--font-mono); margin-top: 2px; }

/* Timeline */
.timeline-grid {
  position: relative;
  height: 200px;
  border-top: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  overflow-x: auto;
  overflow-y: hidden;
}
.timeline-inner { position: relative; height: 100%; min-width: 100%; }

.timeline-month {
  position: absolute;
  top: 0;
  height: 100%;
  border-left: 1px dashed var(--rule);
  padding-left: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-top: 4px;
  white-space: nowrap;
}

.timeline-week-cursor {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
  z-index: 5;
  pointer-events: none;
}
.timeline-week-cursor::before {
  content: '';
  position: absolute;
  top: -4px; left: -4px;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
}

.timeline-today {
  position: absolute;
  top: 0; bottom: 0;
  border-left: 1px dotted var(--warn);
  z-index: 4;
  pointer-events: none;
}
.timeline-today span {
  position: absolute;
  bottom: 4px;
  left: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--warn);
  background: var(--bg-panel);
  padding: 0 3px;
}

.cohort-bar {
  position: absolute;
  height: 18px;
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  overflow: hidden;
  cursor: pointer;
  transition: opacity 0.15s;
}
.cohort-bar:hover { opacity: 0.85; }
.cohort-bar.training { background: var(--iain-soft); color: var(--iain); border: 1px solid var(--iain); }
.cohort-bar.level-1 { background: var(--l1-soft); color: var(--l1); border: 1px solid var(--l1); border-radius: 2px 0 0 2px; }
.cohort-bar.level-2 { background: var(--l2-soft); color: var(--l2); border: 1px solid var(--l2); border-left-width: 0; border-radius: 0 2px 2px 0; }
.cohort-bar.l3 { background: var(--l3-soft); color: var(--l3); border: 1px solid var(--l3); }
.cohort-bar.admin-week {
  background: repeating-linear-gradient(-45deg, var(--bg-sunken), var(--bg-sunken) 4px, transparent 4px, transparent 8px);
  color: var(--ink-faint);
  border: 1px dashed var(--ink-faint);
  font-style: italic;
  font-size: 9px;
}
.cohort-bar.ace { background: var(--ace-soft); color: var(--ace); border: 1px solid var(--ace); }
.cohort-bar.wf { background: var(--wf-soft); color: var(--wf-ink); border: 1px solid var(--wf); }

.week-selector {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--rule-soft);
}
.week-selector label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
}
.week-display { font-family: var(--font-display); font-size: 16px; font-weight: 500; min-width: 150px; }
.week-nav { display: flex; gap: 4px; }
input[type="range"] { flex: 1; min-width: 160px; max-width: 400px; accent-color: var(--accent); }

/* Workload editor */
.editor { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.app.readonly .editor { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) {
  .editor { grid-template-columns: minmax(0, 1fr); }
  .palette { position: static !important; }
  .palette-items { flex-direction: row !important; flex-wrap: wrap; }
}

.palette {
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 16px;
  box-shadow: var(--shadow);
  height: fit-content;
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
}
.palette h3 {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 10px;
}
.palette-items { display: flex; flex-direction: column; gap: 6px; }
.palette-item {
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-size: 12px;
  cursor: grab;
  background: var(--bg-panel);
  transition: all 0.15s;
  user-select: none;
}
.palette-item:hover { background: var(--bg-sunken); border-color: var(--ink-soft); }
.palette-item:active { cursor: grabbing; }
.palette-item.training { background: var(--iain-soft); border-color: var(--iain); color: var(--iain); }
.palette-item.wf { background: var(--wf-soft); border-color: var(--wf); color: var(--wf-ink); }
.palette-item.ace { background: var(--ace-soft); border-color: var(--ace); color: var(--ace); }
.palette-item.l3 { background: var(--l3-soft); border-color: var(--l3); color: var(--l3); }
.palette-hint {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--rule-soft);
  line-height: 1.5;
}

.schedule {
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  box-shadow: var(--shadow);
  overflow: hidden;
  min-width: 0;
}
.schedule-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.schedule-header h3 { font-family: var(--font-display); font-weight: 500; font-size: 17px; }

.override-badge, .derived-badge, .admin-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 8px;
  vertical-align: middle;
}
.override-badge { background: var(--accent-soft); color: var(--accent); }
.derived-badge { background: var(--bg-sunken); color: var(--ink-faint); }
.admin-badge {
  margin-left: 4px;
  background: repeating-linear-gradient(-45deg, var(--bg-sunken), var(--bg-sunken) 3px, transparent 3px, transparent 6px);
  color: var(--ink-soft);
  border: 1px dashed var(--ink-faint);
}

.schedule-totals { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.total { display: flex; align-items: center; gap: 6px; }
.total .name { color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.total .value { font-weight: 600; }
.total .value.warn { color: var(--warn); }

.grid-scroll { overflow-x: auto; }
.grid { display: grid; grid-template-columns: 60px repeat(5, minmax(110px, 1fr)); min-width: 620px; }

.grid-cell {
  border-right: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  padding: 8px;
  min-height: 70px;
  position: relative;
}
.grid-cell:last-child { border-right: none; }
.grid-cell.lane-iain { background: var(--iain-lane); }
.grid-cell.lane-neil { background: var(--neil-lane); }
.grid-cell.lane-iain.lane-divider { border-bottom: 2px solid var(--rule); }
.grid-cell.holiday-day {
  background: repeating-linear-gradient(-45deg, var(--warn-stripe), var(--warn-stripe) 6px, transparent 6px, transparent 12px);
}

.day-header {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  text-align: center;
  padding: 10px 8px;
  background: var(--bg-sunken);
  color: var(--ink-soft);
  min-height: auto;
}
.day-header .day-date { font-size: 9px; font-weight: 400; color: var(--ink-faint); margin-top: 2px; }
.day-header.holiday-header { color: var(--warn); background: var(--warn-soft); }
.day-header.today-header { box-shadow: inset 0 -2px 0 var(--accent); color: var(--ink); }

.person-label {
  background: var(--bg-sunken);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 8px 6px;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--rule);
}
.person-label.iain { color: var(--iain); background: var(--iain-label); border-left: 4px solid var(--iain); }
.person-label.neil { color: var(--neil); background: var(--neil-label); border-left: 4px solid var(--neil); }

.slot { min-height: 70px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.slot-label {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  position: absolute;
  top: 2px;
  left: 4px;
}
.app:not(.readonly) .slot.empty { cursor: pointer; transition: background 0.15s; }
.app:not(.readonly) .slot.empty:hover { background: var(--bg-sunken); }
.slot.drop-target { background: var(--accent-soft); outline: 1px dashed var(--accent); }
.slot.overload { background: var(--warn-soft); outline: 2px solid var(--warn); outline-offset: -2px; }

.activity-block {
  padding: 6px 8px;
  border-radius: 3px;
  font-size: 11px;
  line-height: 1.3;
  position: relative;
  margin-top: 14px;
  border-left: 3px solid var(--rule);
  background: var(--bg-panel);
  color: var(--ink);
}
.activity-block + .activity-block { margin-top: 0; }
.activity-block.editable { cursor: pointer; }
.activity-block.holiday { background: var(--warn-soft); border-left-color: var(--warn); opacity: 0.75; }
.activity-block.training { border-left-color: var(--iain); background: var(--iain-soft); }
.activity-block.training[data-level="1"] { border-left-color: var(--l1); background: var(--l1-soft); }
.activity-block.training[data-level="2"] { border-left-color: var(--l2); background: var(--l2-soft); }
.activity-block.l3 { border-left-color: var(--l3); background: var(--l3-soft); }
.level-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-right: 4px;
}
.activity-block[data-level="1"] .level-tag { color: var(--l1); }
.activity-block[data-level="2"] .level-tag { color: var(--l2); }
.activity-block.l3 .level-tag { color: var(--l3); }
.activity-block.wf { border-left-color: var(--wf); background: var(--wf-soft); }
.activity-block.ace { border-left-color: var(--ace); background: var(--ace-soft); }
.activity-block.makeup { border-left-style: dashed; border-left-width: 4px; }

.activity-name { font-weight: 600; font-size: 11px; overflow-wrap: anywhere; }
.activity-module { font-size: 10px; margin-top: 2px; opacity: 0.9; }

.activity-delete {
  position: absolute;
  top: 2px;
  right: 2px;
  font-size: 13px;
  line-height: 1;
  color: var(--ink-faint);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  background: none;
  border: none;
  padding: 2px 4px;
}
.activity-block:hover .activity-delete, .activity-delete:focus-visible { opacity: 1; }
.activity-delete:hover { color: var(--warn); background: none; }
@media (hover: none) { .activity-delete { opacity: 1; } }

.holiday-tag, .makeup-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 1px 5px;
  border-radius: 8px;
  margin-top: 3px;
}
.holiday-tag { background: var(--warn-soft); color: var(--warn); }
.makeup-tag { background: var(--accent-soft); color: var(--accent); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-panel);
  color: var(--ink);
  border-radius: 4px;
  padding: 24px;
  width: min(500px, 100%);
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal.wide { width: min(560px, 100%); }
.modal h3 { font-family: var(--font-display); font-weight: 500; font-size: 18px; margin-bottom: 16px; text-wrap: balance; }
.modal-text { font-size: 13px; color: var(--ink-soft); line-height: 1.55; margin-bottom: 8px; white-space: pre-line; }
.modal-field { margin-bottom: 12px; }
.modal-field label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  display: block;
  margin-bottom: 4px;
}
.modal-field select, .modal-field input { width: 100%; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }

/* Programme level legend */
.module-legend {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.level-card {
  padding: 10px 12px;
  border-radius: 3px;
  border: 1px solid var(--rule);
  border-top: 3px solid var(--level-color);
  background: var(--bg-panel);
  min-width: 0;
}
.level-card.level-1 { --level-color: var(--l1); }
.level-card.level-2 { --level-color: var(--l2); }
.level-card.level-3 { --level-color: var(--l3); }
.level-card .level-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.level-card .level-name { font-weight: 600; font-size: 13px; color: var(--level-color); }
.level-card .level-length { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.level-card .level-modules { font-size: 11px; color: var(--ink-soft); margin-top: 4px; line-height: 1.5; }
.cohort-levels { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
.cohort-levels .l1 { color: var(--l1); font-weight: 600; }
.cohort-levels .l2 { color: var(--l2); font-weight: 600; }

/* Holidays & closures */
.cal-columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.cal-columns h3 {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.cal-intro { font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; max-width: 72ch; line-height: 1.5; }
.cal-list { display: flex; flex-direction: column; gap: 4px; }
.cal-row { display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.cal-row.closure { grid-template-columns: 130px 130px minmax(0, 1fr) auto; }
.cal-row input { width: 100%; padding: 5px 8px; font-size: 12px; min-width: 0; }
.cal-row.past { opacity: 0.55; }
.cal-row.add-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--rule); }
.cal-text { font-size: 12px; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px; padding: 3px 0; }
.cal-text .d { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.cal-text.past { opacity: 0.55; }
.cal-remove { padding: 3px 8px; color: var(--ink-faint); }
.cal-remove:hover { color: var(--warn); }
.cal-show-past { margin-top: 8px; }
@media (max-width: 560px) {
  .cal-row, .cal-row.closure { grid-template-columns: 1fr 1fr; }
  .cal-row input[type="text"] { grid-column: 1 / -1; }
}
.slot-hint { font-size: 12px; color: var(--ink-faint); padding: 8px 0; grid-column: 1 / -1; }

/* Holiday clash list */
.holiday-clashes { background: var(--warn-soft); border-radius: 3px; padding: 12px 16px; margin-top: 12px; }
.holiday-clashes h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--warn);
  margin-bottom: 8px;
}
.holiday-clash-item { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 4px 0; font-size: 12px; }
.holiday-clash-item .date { font-family: var(--font-mono); font-size: 11px; color: var(--warn); min-width: 60px; }
.holiday-clash-item .module { color: var(--ink-soft); font-size: 11px; }
.holiday-clash-item .reason { margin-left: auto; color: var(--warn); font-size: 11px; }

/* Summary panel */
.summary {
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 20px 24px;
  margin-top: 16px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 24px;
}
.summary-block h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.summary-block .stat {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  line-height: 1;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.summary-block .stat.warn { color: var(--warn); }
.summary-block .detail { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.summary-block .detail .warn-text { color: var(--warn); font-weight: 600; }

footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  text-align: center;
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform: translateX(-50%);
  max-width: calc(100vw - 32px);
  width: max-content;
  background: var(--ink);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 4px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  z-index: 200;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div id="app"></div>

<template id="appTemplate">
<div class="app readonly" id="appRoot">

  <div class="status-bar" id="statusBar" data-state="view" role="status">
    <span class="status-dot"></span>
    <span id="statusText">Loading…</span>
    <span class="status-spacer"></span>
    <span class="status-actions" id="statusActions"></span>
  </div>

  <header>
    <div class="title-block">
      <h1>Workload Planner</h1>
      <div class="subtitle">QA Programme · Iain &amp; Neil · 2026–27</div>
    </div>
    <div class="scenarios">
      <label for="scenarioSelect">Scenario</label>
      <select id="scenarioSelect"></select>
      <button id="saveAsBtn" class="edit-only">Save as new scenario…</button>
      <button id="exportBtn" class="edit-only">Export</button>
      <button id="importBtn" class="edit-only">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button id="deleteBtn" class="warn edit-only">Delete scenario</button>
      <button id="clearAllBtn" class="edit-only">Clear overrides</button>
    </div>
  </header>

  <section class="panel" id="cohortPanel">
    <div class="panel-header" id="cohortPanelHeader" role="button" tabindex="0" aria-expanded="true">
      <div>
        <h2>Programmes &amp; ongoing activities</h2>
        <div class="panel-meta" id="cohortPanelMeta">— cohorts</div>
      </div>
      <div class="panel-toggle" id="cohortPanelToggle">▼</div>
    </div>
    <div class="panel-body">
      <div class="module-legend" id="moduleLegend"></div>
      <div class="cohort-list" id="cohortList"></div>
      <div class="add-buttons edit-only">
        <button id="addCohortBtn" class="primary">+ New Level 1–2 cohort</button>
        <button id="addL3Btn">+ New Level 3 group</button>
        <button id="addOngoingBtn">+ New ongoing activity</button>
        <button id="autoFillBtn">⟳ Auto-fill rolling cohorts</button>
      </div>
      <div id="holidayClashes"></div>
    </div>
  </section>

  <section class="panel collapsed" id="holidayPanel">
    <div class="panel-header" id="holidayPanelHeader" role="button" tabindex="0" aria-expanded="false">
      <div>
        <h2>Holidays &amp; closures</h2>
        <div class="panel-meta" id="holidayPanelMeta">—</div>
      </div>
      <div class="panel-toggle" id="holidayPanelToggle">▶</div>
    </div>
    <div class="panel-body">
      <p class="cal-intro">No sessions run on these days. Level 1–2 cohorts that land on one get a makeup session at the end, so changing a date here moves cohort end dates.</p>
      <div class="cal-columns">
        <div>
          <h3>Public holidays</h3>
          <div class="cal-list" id="holidayList"></div>
        </div>
        <div>
          <h3>Organisation closures</h3>
          <div class="cal-list" id="closureList"></div>
        </div>
      </div>
      <button class="small cal-show-past" id="showPastHolidaysBtn">Show past dates</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header no-toggle">
      <h2>Programme timeline</h2>
      <div class="panel-meta" id="timelineMeta"></div>
    </div>
    <div class="panel-body" style="padding-top: 12px;">
      <div class="timeline-grid" id="timelineGrid">
        <div class="timeline-inner" id="timelineInner"></div>
      </div>
      <div class="week-selector">
        <label for="weekSlider">Week of</label>
        <div class="week-display" id="weekDisplay">—</div>
        <div class="week-nav">
          <button class="small" id="prevWeekBtn" aria-label="Previous week">‹</button>
          <button class="small" id="todayWeekBtn">This week</button>
          <button class="small" id="nextWeekBtn" aria-label="Next week">›</button>
        </div>
        <input type="range" id="weekSlider" min="0" max="34" value="0">
      </div>
    </div>
  </section>

  <section class="editor">
    <aside class="palette edit-only">
      <h3>Add activities</h3>
      <div class="palette-items">
        <div class="palette-item training" draggable="true" data-type="training">Level 1–2 (manual)</div>
        <div class="palette-item wf" draggable="true" data-type="wf">Work Foundations</div>
        <div class="palette-item ace" draggable="true" data-type="ace">ACE</div>
        <div class="palette-item l3" draggable="true" data-type="l3">Level 3 (manual)</div>
      </div>
      <div class="palette-hint">
        Drag onto a slot, or click any empty slot to add. Cohorts and ongoing activities fill the week automatically. Edits here apply to this week only.
      </div>
    </aside>

    <div class="schedule">
      <div class="schedule-header">
        <h3 id="scheduleTitle">Week of —</h3>
        <div class="schedule-totals" id="scheduleTotals"></div>
      </div>
      <div class="grid-scroll">
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </section>

  <section class="summary" id="summary"></section>

  <footer id="footerText">Workload Planner</footer>

  <!-- Cohort form modal -->
  <div class="modal-overlay" id="cohortFormModal">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="cohortFormTitle">
      <h3 id="cohortFormTitle">New Level 1–2 cohort</h3>
      <p class="modal-text" style="margin-bottom: 14px;">Runs Level 1 (Game Playtester, Game Bug Tester) then Level 2 (Lead Gameplay Tester, Test Case Writer, Test Plan Writer): 40 sessions over about 20 weeks.</p>
      <div class="form-row cols-3">
        <div class="form-field">
          <label for="cohortNumberInput">Cohort number</label>
          <input type="number" id="cohortNumberInput" min="1">
        </div>
        <div class="form-field">
          <label for="cohortStartInput">Start date</label>
          <input type="date" id="cohortStartInput">
        </div>
        <div class="form-field">
          <label for="cohortParticipantsInput">Participants</label>
          <input type="number" id="cohortParticipantsInput" min="1" max="20" value="6">
        </div>
      </div>
      <div class="form-field" style="margin-bottom: 16px;">
        <label>Timeslot</label>
        <div class="timeslot-buttons" id="timeslotButtons"></div>
      </div>
      <div class="form-field" id="facilitatorsField" hidden>
        <label>Facilitator per day</label>
        <div id="facilitatorPerDay" style="display: grid; gap: 8px; margin-top: 6px;"></div>
      </div>
      <div class="modal-actions">
        <button id="cohortFormCancel">Cancel</button>
        <button id="cohortFormSave" class="primary">Generate schedule</button>
      </div>
    </div>
  </div>

  <!-- Ongoing activity form modal -->
  <div class="modal-overlay" id="ongoingFormModal">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="ongoingFormTitle">
      <h3 id="ongoingFormTitle">New ongoing activity</h3>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="ongoingNameInput">Name</label>
          <input type="text" id="ongoingNameInput" placeholder="e.g. Work Foundations">
        </div>
        <div class="form-field">
          <label for="ongoingTypeSelect">Type</label>
          <select id="ongoingTypeSelect">
            <option value="wf">Work Foundations</option>
            <option value="ace">ACE</option>
          </select>
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="ongoingStartInput">Start date</label>
          <input type="date" id="ongoingStartInput">
        </div>
        <div class="form-field">
          <label for="ongoingEndInput">End date (blank = ongoing)</label>
          <input type="date" id="ongoingEndInput">
        </div>
      </div>
      <div class="form-field" style="margin-bottom: 12px;">
        <label for="ongoingFacilitatorSelect">Facilitator</label>
        <select id="ongoingFacilitatorSelect">
          <option value="iain">Iain</option>
          <option value="neil">Neil</option>
        </select>
      </div>
      <div class="form-field">
        <label>Days &amp; sessions</label>
        <div id="ongoingDaysGrid" style="display: grid; grid-template-columns: 80px repeat(2, 1fr); gap: 6px; margin-top: 6px;"></div>
      </div>
      <div class="modal-actions">
        <button id="ongoingFormCancel">Cancel</button>
        <button id="ongoingFormSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Level 3 group modal -->
  <div class="modal-overlay" id="l3FormModal">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="l3FormTitle">
      <h3 id="l3FormTitle">New Level 3 group</h3>
      <p class="modal-text" style="margin-bottom: 14px;">Level 3 holds a training timeslot with no set finish. Intake is rolling and each participant stays for up to 6 months.</p>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="l3NameInput">Name</label>
          <input type="text" id="l3NameInput" placeholder="e.g. Level 3">
        </div>
        <div class="form-field">
          <label for="l3ParticipantsInput">Current participants</label>
          <input type="number" id="l3ParticipantsInput" min="0" max="20" value="6">
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="l3StartInput">Start date</label>
          <input type="date" id="l3StartInput">
        </div>
        <div class="form-field">
          <label for="l3EndInput">End date (blank = ongoing)</label>
          <input type="date" id="l3EndInput">
        </div>
      </div>
      <div class="form-field" style="margin-bottom: 16px;">
        <label>Timeslot</label>
        <div class="timeslot-buttons" id="l3TimeslotButtons"></div>
      </div>
      <div class="form-field" id="l3FacilitatorsField" hidden>
        <label>Facilitator per day</label>
        <div id="l3FacilitatorPerDay" style="display: grid; gap: 8px; margin-top: 6px;"></div>
      </div>
      <div class="modal-actions">
        <button id="l3FormCancel">Cancel</button>
        <button id="l3FormSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Auto-fill rolling cohorts modal -->
  <div class="modal-overlay" id="autoFillModal">
    <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="autoFillTitle">
      <h3 id="autoFillTitle">Auto-fill rolling cohorts</h3>
      <p class="modal-text" style="margin-bottom: 16px;">Generates a continuous flow of cohorts in the selected timeslots. Each new cohort starts one admin week after the previous one ends in the same slot. Existing cohorts are kept. Slots held by a Level 3 group are skipped while the group runs.</p>
      <div class="form-field" style="margin-bottom: 14px;">
        <label>Timeslots to fill</label>
        <div id="autoFillSlots" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 6px;"></div>
      </div>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="autoFillStartNum">Start cohort number from</label>
          <input type="number" id="autoFillStartNum" min="1">
        </div>
        <div class="form-field">
          <label for="autoFillEndDate">Fill until (end date)</label>
          <input type="date" id="autoFillEndDate">
        </div>
      </div>
      <div class="form-row cols-2">
        <div class="form-field">
          <label for="autoFillFacilitator">Facilitator for new cohorts</label>
          <select id="autoFillFacilitator">
            <option value="neil">Neil (both days)</option>
            <option value="iain">Iain (both days)</option>
          </select>
        </div>
        <div class="form-field">
          <label for="autoFillParticipants">Participants per cohort</label>
          <input type="number" id="autoFillParticipants" min="1" max="20" value="6">
        </div>
      </div>
      <div class="form-field" style="margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--rule-soft);">
        <label class="check-tile" style="text-transform: none; letter-spacing: 0; border: none; padding: 0; background: none;">
          <input type="checkbox" id="autoFillIncludeWF" checked>
          <span style="font-family: var(--font-body); font-size: 13px; color: var(--ink);">Also create Work Foundations (Wed/Thu/Fri AM &amp; PM, Iain)</span>
        </label>
      </div>
      <div class="modal-actions">

  { id: "wf-pm", label: "Wed/Fri Afternoon", days: ["Wed", "Fri"], session: "pm", time: "1:30pm – 4:30pm", short: "Wed/Fri PM" },
];

const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
const SESSIONS = ['am', 'pm'];
const PEOPLE = ['iain', 'neil'];
const DAY_INDEX = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4 };

const ACTIVITY_LABELS = {

  l3: 'Level 3',
  wf: 'Work Foundations',
  ace: 'ACE',
};

// Weekly delivery thresholds (hours)
const IAIN_MAX_HOURS = 27;
const NEIL_MAX_HOURS = 15;

// Timeline range
const TIMELINE_START = new Date(2026, 4, 18); // 18 May 2026 (Monday)
const WEEKS_BASE = 33; // minimum horizon

const SCHEDULE_VERSION = 3; // bump when holiday/closure data or schedule logic changes
const DRAFT_KEY = 'workload-planner-draft';
const VIEW_KEY = 'workload-planner-view';

// ============================================================================

// ============================================================================

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function personName(p) { return p === 'neil' ? 'Neil' : 'Iain'; }

function storageGet(store, key) {
  if (!store) return null; try { const raw = store.getItem(key); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
}
function storageSet(store, key, value) {
  if (!store) return; try { store.setItem(key, JSON.stringify(value)); } catch (_) {}
}
function storageRemove(store, key) {
  if (!store) return; try { store.removeItem(key); } catch (_) {}
}
function local() { try { return window.localStorage; } catch (_) { return null; } }
function session() { try { return window.sessionStorage; } catch (_) { return null; } }

let toastTimer = null;
function toast(message, ms = 3500) {
  const el = $('toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

// In-page replacement for confirm(): resolves with the chosen button's value, or null on cancel.
function askChoice(title, message, buttons) {
  return new Promise(resolve => {
    const overlay = $('confirmModal');
    $('confirmTitle').textContent = title;
    $('confirmMessage').textContent = message || '';
    const actions = $('confirmActions');
    actions.innerHTML = '';
    const finish = value => {
      overlay.classList.remove('active');
      document.removeEventListener('keydown', onKey);
      resolve(value);
    };
    const onKey = e => { if (e.key === 'Escape') finish(null); };
    document.addEventListener('keydown', onKey);
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      if (b.kind) btn.className = b.kind;
      btn.addEventListener('click', () => finish(b.value));
      actions.appendChild(btn);
    });
    overlay.classList.add('active');
    const primary = actions.querySelector('button:last-child');
    if (primary) primary.focus();
  });
}

async function askConfirm(title, message, okLabel = 'OK', danger = false) {
  const v = await askChoice(title, message, [
    { label: 'Cancel', value: false },
    { label: okLabel, value: true, kind: danger ? 'warn' : 'primary' },
  ]);
  return v === true;
}

// ============================================================================
// DATE HELPERS
// ============================================================================

// The calendar in use: the working copy's holidays and closures.
let calendar = { holidays: DEFAULT_HOLIDAYS, closures: DEFAULT_CLOSURES };
let _holidayLookup = null;

function setCalendar(cal) {
  calendar = cal;
  _holidayLookup = null;
}

function isHoliday(dateStr) {
  if (!_holidayLookup) {
    _holidayLookup = {};
    expandClosures().forEach(c => { _holidayLookup[c.date] = c; });
    calendar.holidays.forEach(h => { _holidayLookup[h.date] = h; }); // public holiday names win
  }
  return _holidayLookup[dateStr] || undefined;
}

function formatDateISO(d) {
  // Local-time YYYY-MM-DD (avoids timezone shifts from toISOString)
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function parseDate(s) {
  // Parse YYYY-MM-DD as local date
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getNextWeekday(startDate, targetDay) {
  const start = parseDate(startDate);
  const startDow = (start.getDay() + 6) % 7; // Mon=0, Sun=6
  let diff = DAY_INDEX[targetDay] - startDow;
  if (diff < 0) diff += 7;
  return addDays(start, diff);
}

function getMondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = (d.getDay() + 6) % 7;
  return addDays(d, -dow);
}

function weekIndexFromDate(date) {
  // Returns week index relative to TIMELINE_START
  const mon = getMondayOf(date);
  const diffMs = mon - TIMELINE_START;
  return Math.round(diffMs / (7 * 24 * 60 * 60 * 1000));
}

function weekStartDate(weekIdx) {
  return addDays(TIMELINE_START, weekIdx * 7);
}

function formatWeekLabel(weekIdx) {
  return weekStartDate(weekIdx).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
}

function formatStamp(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function todayWeekIdx() {
  return weekIndexFromDate(new Date());
}

// ============================================================================
// COHORT SCHEDULE GENERATION
// ============================================================================

function generateSchedule(startDate, timeslotId) {
  const timeslot = TIMESLOTS.find(t => t.id === timeslotId);
  if (!timeslot) return [];

  const sessions = [];
  let sessionCount = 0;
  const totalSessions = 40;

  const [day1, day2] = timeslot.days;
  const cursor1 = getNextWeekday(startDate, day1);
  const cursor2 = getNextWeekday(startDate, day2);

  const allDates = [];
  const weeksNeeded = 40; // comfortably accommodates Christmas closures
  for (let w = 0; w < weeksNeeded; w++) {
    allDates.push({ date: addDays(cursor1, w * 7), day: day1 });
    allDates.push({ date: addDays(cursor2, w * 7), day: day2 });
  }
  allDates.sort((a, b) => a.date - b.date);

  let moduleIndex = 0;
  let weekInModule = 1;
  let sessionsInWeek = 0;
  let moduleSessionNum = 0;
  let holidayCount = 0;
  const holidayDates = [];

  for (const slot of allDates) {
    if (sessionCount >= totalSessions) break;

    const dateStr = formatDateISO(slot.date);
    const holiday = isHoliday(dateStr);
    const mod = MODULES[moduleIndex];

    sessions.push({
      dateStr,
      day: slot.day,
      session: timeslot.session,
      moduleId: mod.id,
      moduleName: mod.name,
      moduleIndex: moduleIndex + 1,
      weekInModule,
      sessionNumber: sessionCount + 1,
      moduleSessionNumber: holiday ? null : moduleSessionNum + 1,
      isHoliday: !!holiday,
      holidayName: holiday ? holiday.name : null,
      isMakeup: false, // flagged retroactively once the count is known
    });

    if (holiday) {
      holidayCount++;
      holidayDates.push({ date: dateStr, name: holiday.name });
    } else {
      sessionCount++;
      sessionsInWeek++;
      moduleSessionNum++;
      if (sessionsInWeek >= 2) {
        sessionsInWeek = 0;
        weekInModule++;
        if (weekInModule > mod.weeks) {
          weekInModule = 1;
          moduleIndex++;
          moduleSessionNum = 0;
        }
      }
    }
  }

  // Flag the last N real sessions as makeup, where N = number of holiday-affected sessions
  if (holidayCount > 0) {
    const realSessionIndices = [];
    sessions.forEach((s, i) => { if (!s.isHoliday) realSessionIndices.push(i); });
    const makeupIndices = realSessionIndices.slice(-holidayCount);
    makeupIndices.forEach((i, k) => {
      sessions[i].isMakeup = true;
      if (holidayDates[k]) sessions[i].makeupFor = holidayDates[k];
    });
  }

  return sessions;
}

// ============================================================================
// STATE
// ============================================================================
// The shared plan lives in the #plannerData block of this page. Editors change a
// working copy and publish a new version of the page; everyone else sees the
// latest published version. Which scenario and week you are looking at is yours
// alone and is remembered in this browser.

function defaultScenario() {
  return { cohorts: [], ongoing: [], overrides: {} };
}

function normalizeScenario(scn) {
  scn = scn && typeof scn === 'object' ? scn : {};
  if (!Array.isArray(scn.cohorts)) scn.cohorts = [];
  if (!Array.isArray(scn.ongoing)) scn.ongoing = [];
  if (!scn.overrides || typeof scn.overrides !== 'object') scn.overrides = {};
  scn.ongoing.forEach(o => {
    if (!Array.isArray(o.slots)) o.slots = [];
    if (o.type === 'continuation') o.type = 'l3'; // "QA Open Studio" was the working title for Level 3
    if (o.type === 'l3' && o.name === 'Level 3 · NDIS') o.name = 'Level 3'; // earlier default name
  });
  Object.values(scn.overrides).forEach(week => {
    if (Array.isArray(week)) week.forEach(a => { if (a.type === 'continuation') a.type = 'l3'; });
  });
  scn.cohorts.forEach(c => { if (!Array.isArray(c.sessions)) c.sessions = []; });
  return scn;
}

function normalizeScenarios(scenarios) {
  const out = scenarios && typeof scenarios === 'object' ? scenarios : {};
  Object.keys(out).forEach(k => { out[k] = normalizeScenario(out[k]); });
  if (!out['Current state']) out['Current state'] = defaultScenario();
  return out;
}

function regenerateSessions(scenarios) {
  Object.values(scenarios).forEach(scn => {
    scn.cohorts.forEach(c => {
      if (c.startDate && c.timeslotId) c.sessions = generateSchedule(c.startDate, c.timeslotId);
    });
  });
}

const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

function normalizeCalendar(cal) {
  if (!cal || typeof cal !== 'object') cal = { holidays: DEFAULT_HOLIDAYS, closures: DEFAULT_CLOSURES };
  const holidays = (Array.isArray(cal.holidays) ? cal.holidays : [])
    .filter(h => h && ISO_DATE.test(h.date))
    .map(h => ({ date: h.date, name: String(h.name || 'Public holiday') }))
    .sort((a, b) => a.date.localeCompare(b.date));
  const closures = (Array.isArray(cal.closures) ? cal.closures : [])
    .filter(c => c && ISO_DATE.test(c.start) && ISO_DATE.test(c.end) && c.end >= c.start)
    .map(c => ({ start: c.start, end: c.end, name: String(c.name || 'Closure') }))
    .sort((a, b) => a.start.localeCompare(b.start));
  return { holidays, closures };
}

function sharedJSON(scenarios, cal) {
  return JSON.stringify({ scenarios, calendar: cal });
}

// The plan the team sees is stored on the server (/api/plan). `published` is the
// last version this page loaded or saved; `state` is the working copy on screen.
const API = '/api/plan';
const PIN_KEY = 'workload-planner-pin';

let state = { currentScenario: 'Current state', currentWeek: 0, scenarios: {}, calendar: null };
let published = { version: 0, updatedAt: null, scenarios: {}, calendar: null };
let publishedJSON = '';
let showPastHolidays = false;

function setPublished(plan, version, updatedAt) {
  plan = plan || {};
  const scenarios = normalizeScenarios(structuredClone(plan.scenarios));
  const cal = normalizeCalendar(plan.calendar);
  setCalendar(cal);
  regenerateSessions(scenarios); // holidays or schedule rules may have changed since it was saved
  published = { version: Number(version) || 0, updatedAt: updatedAt || null, scenarios, calendar: cal };
  publishedJSON = sharedJSON(scenarios, cal);
  if (state.calendar) setCalendar(state.calendar);
}

// Starting plan, used until the server answers (and when the server has no plan yet)
let seedPlan = {};
try { seedPlan = JSON.parse($('plannerData').textContent) || {}; } catch (_) {}
setPublished(seedPlan, 0, null);
applyShared(published.scenarios, published.calendar);

// 'pending' while loading; 'view' read-only; 'edit' unlocked with the PIN; 'local' opened as a plain file.
let mode = 'pending';
let editorPin = null;
let loadError = false;
let publishing = false;
let draftOffer = null; // an unpublished draft from an earlier visit, offered for restore

function isEditable() { return mode === 'edit' || mode === 'local'; }
function isDirty() { return sharedJSON(state.scenarios, state.calendar) !== publishedJSON; }

// Replace the shared plan (draft restore, discard). Sessions are rebuilt against its calendar.
function applyShared(scenarios, cal) {
  state.scenarios = normalizeScenarios(structuredClone(scenarios));
  state.calendar = normalizeCalendar(structuredClone(cal));
  setCalendar(state.calendar);
  regenerateSessions(state.scenarios);
  if (!state.scenarios[state.currentScenario]) state.currentScenario = 'Current state';
}

// Call after any change to holidays or closures: every cohort's dates depend on them.
function calendarChanged() {
  state.calendar = normalizeCalendar(state.calendar);
  setCalendar(state.calendar);
  regenerateSessions(state.scenarios);
  commit();
  render();
}

function loadView() {
  const v = storageGet(local(), VIEW_KEY);
  if (v && v.currentScenario && state.scenarios[v.currentScenario]) state.currentScenario = v.currentScenario;
  // Open on this week every time; the week you were looking at only matters within a visit.
  state.currentWeek = Math.max(0, Math.min(getTimelineHorizon(), todayWeekIdx()));
  const s = storageGet(session(), VIEW_KEY);
  if (s && Number.isInteger(s.currentWeek)) state.currentWeek = s.currentWeek;
  if (v && v.cohortCollapsed) setPanelCollapsed('cohort', true);
  setPanelCollapsed('holiday', !(v && v.holidayOpen));
}

function saveView() {
  storageSet(local(), VIEW_KEY, {
    currentScenario: state.currentScenario,
    cohortCollapsed: $('cohortPanel').classList.contains('collapsed'),
    holidayOpen: !$('holidayPanel').classList.contains('collapsed'),
  });
  storageSet(session(), VIEW_KEY, { currentWeek: state.currentWeek });
}

// Call after any change to the shared plan.
function commit() {
  if (isDirty()) {
    storageSet(local(), DRAFT_KEY, { savedAt: new Date().toISOString(), scenarios: state.scenarios, calendar: state.calendar });
  } else {
    storageRemove(local(), DRAFT_KEY);
  }
  draftOffer = null;
  renderStatus();
}

function currentScn() {
  if (!state.scenarios[state.currentScenario]) state.currentScenario = 'Current state';
  return state.scenarios[state.currentScenario];
}

// Computes the timeline horizon — at least WEEKS_BASE, extended to cover all cohorts + buffer
function getTimelineHorizon() {
  const scn = currentScn();
  let max = WEEKS_BASE;
  if (scn) {
    scn.cohorts.forEach(c => {
      const last = c.sessions[c.sessions.length - 1];
      if (!last) return;
      const w = weekIndexFromDate(parseDate(last.dateStr));
      if (w + 2 > max) max = w + 2; // cohort end + admin week + 1
    });
    scn.ongoing.forEach(o => {
      if (!o.endDate) return;
      const w = weekIndexFromDate(parseDate(o.endDate));
      if (w + 1 > max) max = w + 1;
    });
  }
  return max;
}

function setWeek(w) {
  state.currentWeek = Math.max(0, Math.min(getTimelineHorizon(), w));
  saveView();
  render();
}

// ============================================================================
// HOSTING: load, unlock, publish, drafts
// ============================================================================

async function fetchPlan() {
  const res = await fetch(API, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  setPublished(data.plan || seedPlan, data.version, data.updatedAt);
}

function savedDraft() {
  const draft = storageGet(local(), DRAFT_KEY);
  if (!draft || !draft.scenarios) return null;
  const differs = sharedJSON(normalizeScenarios(structuredClone(draft.scenarios)), normalizeCalendar(draft.calendar || published.calendar)) !== publishedJSON;
  if (!differs) { storageRemove(local(), DRAFT_KEY); return null; }
  return draft;
}

async function checkPin(pin) {
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-planner-pin': pin },
      body: JSON.stringify({ action: 'check' }),
    });
    if (res.ok) return 'ok';
    if (res.status === 401) return 'wrong';
    if (res.status === 500) return 'unset';
    return 'error';
  } catch (_) {
    return 'error';
  }
}

function startEditing(pin) {
  editorPin = pin;
  storageSet(local(), PIN_KEY, pin);
  mode = 'edit';
  draftOffer = savedDraft();
}

async function unlockEditing() {
  let message = 'Enter the editor PIN to change the plan.';
  for (;;) {
    const pin = await askPin(message);
    if (!pin) return;
    const result = await checkPin(pin);
    if (result === 'ok') {
      startEditing(pin);
      render();
      toast('Editing unlocked in this browser.');
      return;
    }
    if (result === 'wrong') { message = "That PIN didn't work. Try again."; continue; }
    toast(result === 'unset'
      ? 'Editing is not set up yet: PLANNER_PIN is missing on the server.'
      : "Can't reach the planner to check the PIN. Try again in a moment.", 6000);
    return;
  }
}

async function lockEditing() {
  if (isDirty() && !(await askConfirm('Lock editing?', 'Your unpublished changes stay saved in this browser. Unlock again to publish or discard them.', 'Lock editing'))) return;
  editorPin = null;
  storageRemove(local(), PIN_KEY);
  mode = 'view';
  draftOffer = null;
  applyShared(published.scenarios, published.calendar);
  render();
}

async function publishChanges() {
  if (mode !== 'edit' || publishing) return;
  publishing = true;
  renderStatus();
  const plan = { scheduleVersion: SCHEDULE_VERSION, calendar: state.calendar, scenarios: state.scenarios };
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-planner-pin': editorPin },
      body: JSON.stringify({ action: 'save', baseVersion: published.version, plan }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      setPublished(plan, data.version, data.updatedAt);
      storageRemove(local(), DRAFT_KEY);
      toast('Published. The team sees this version now.');
    } else if (res.status === 409) {
      // Keep this editor's work as a draft, show the newer version, and offer the draft back.
      const mine = { savedAt: new Date().toISOString(), scenarios: structuredClone(state.scenarios), calendar: structuredClone(state.calendar) };
      storageSet(local(), DRAFT_KEY, mine);
      setPublished(data.plan || seedPlan, data.version, data.updatedAt);
      applyShared(published.scenarios, published.calendar);
      draftOffer = mine;
      toast('Someone published a newer version first. It is loaded now. Restore puts your changes back over it.', 8000);
    } else if (res.status === 401) {
      editorPin = null;
      storageRemove(local(), PIN_KEY);
      mode = 'view';
      applyShared(published.scenarios, published.calendar);
      toast('The editor PIN has changed. Your changes are saved in this browser; unlock with the new PIN to publish them.', 8000);
    } else if (res.status === 413) {
      toast('The plan is too large to save. Delete unused scenarios and try again.', 7000);
    } else {
      toast((data.error || 'Could not publish.') + ' Your changes are still here; try again.', 7000);
    }
  } catch (_) {
    toast("Can't reach the planner. Your changes are still here; try again.", 7000);
  } finally {
    publishing = false;
    render();
  }
}

function restoreDraft() {
  if (!draftOffer) return;
  applyShared(draftOffer.scenarios, draftOffer.calendar || published.calendar);
  draftOffer = null;
  commit();
  render();
}

async function discardChanges() {
  if (!(await askConfirm('Discard unpublished changes?', 'The planner goes back to the last published version.', 'Discard', true))) return;
  applyShared(published.scenarios, published.calendar);
  draftOffer = null;
  storageRemove(local(), DRAFT_KEY);
  render();
}

function dismissDraft() {
  draftOffer = null;
  storageRemove(local(), DRAFT_KEY);
  renderStatus();
}

async function initHosting() {
  mode = 'pending';
  render();
  try {
    await fetchPlan();
    loadError = false;
  } catch (_) {
    if (location.protocol === 'file:') {
      // Opened as a plain file: edit freely, changes stay in this browser.
      mode = 'local';
      const draft = savedDraft();
      if (draft) applyShared(draft.scenarios, draft.calendar || published.calendar);
      render();
      return;
    }
    loadError = true;
    mode = 'view';
    render();
    return;
  }
  applyShared(published.scenarios, published.calendar);

  const pin = storageGet(local(), PIN_KEY);
  mode = 'view';
  if (pin) {
    const result = await checkPin(pin);
    if (result === 'ok') startEditing(pin);
    else if (result === 'wrong') storageRemove(local(), PIN_KEY);
  }
  render();
}

// Pick up newer versions while the page is open: on return to the tab and every few minutes.
async function refreshPlan() {
  if (mode === 'local' || mode === 'pending' || publishing || document.hidden) return;
  if (loadError) { initHosting(); return; }
  if (mode === 'edit' && isDirty()) return; // a publish from here will report the newer version
  const before = published.version;
  try { await fetchPlan(); } catch (_) { return; }
  if (published.version !== before) {
    applyShared(published.scenarios, published.calendar);
    render();
    toast('The plan was updated.');
  }
}
document.addEventListener('visibilitychange', refreshPlan);
setInterval(refreshPlan, 5 * 60 * 1000);

function askPin(message) {
  return new Promise(resolve => {
    const overlay = $('pinModal');
    $('pinMsg').textContent = message;
    $('pinInput').value = '';
    const finish = value => {
      overlay.classList.remove('active');
      $('pinForm').removeEventListener('submit', onSubmit);
      $('pinCancel').removeEventListener('click', onCancel);
      resolve(value);
    };
    const onSubmit = e => { e.preventDefault(); finish($('pinInput').value.trim() || null); };
    const onCancel = () => finish(null);
    $('pinForm').addEventListener('submit', onSubmit);
    $('pinCancel').addEventListener('click', onCancel);
    overlay.classList.add('active');
    $('pinInput').focus();
  });
}

function renderStatus() {
  const bar = $('statusBar');
  const text = $('statusText');
  const actions = $('statusActions');
  const stamp = formatStamp(published.updatedAt);
  $('appRoot').classList.toggle('readonly', !isEditable());
  actions.innerHTML = '';

  const addBtn = (label, onClick, kind) => {
    const b = document.createElement('button');
    b.className = 'small' + (kind ? ' ' + kind : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    actions.appendChild(b);
    return b;
  };

  if (mode === 'pending') {
    bar.dataset.state = 'view';
    text.textContent = 'Loading the plan…';
    return;
  }

  if (mode === 'local') {
    bar.dataset.state = isDirty() ? 'dirty' : 'published';
    text.textContent = 'Local copy · changes are saved in this browser only';
    return;
  }

  if (mode === 'view') {
    bar.dataset.state = loadError ? 'dirty' : 'view';
    text.textContent = loadError
      ? "Can't reach the planner. Retrying when you come back to this tab."
      : 'View only' + (stamp ? ' · Last updated ' + stamp : '');
    if (loadError) addBtn('Try again', initHosting);
    else addBtn('Editor unlock', unlockEditing);
    return;
  }

  // Editor
  if (draftOffer) {
    bar.dataset.state = 'dirty';
    text.textContent = 'You have unpublished changes from ' + (formatStamp(draftOffer.savedAt) || 'an earlier visit') + '.';
    addBtn('Discard them', dismissDraft);
    addBtn('Restore', restoreDraft, 'primary');
    return;
  }

  if (publishing) {
    bar.dataset.state = 'dirty';
    text.textContent = 'Publishing…';
    return;
  }

  if (isDirty()) {
    bar.dataset.state = 'dirty';
    text.textContent = 'Unpublished changes · the team still sees the version from ' + (stamp || 'the last publish');
    addBtn('Discard', discardChanges);
    addBtn('Publish for team', publishChanges, 'primary');
  } else {
    bar.dataset.state = 'published';
    text.textContent = 'Editing · ' + (stamp ? 'Last published ' + stamp : 'Nothing published yet');
    addBtn('Lock editing', lockEditing);
  }
}

window.addEventListener('beforeunload', e => {
  if (mode === 'edit' && isDirty() && !publishing) { e.preventDefault(); e.returnValue = ''; }
});

// ============================================================================
// DERIVING WEEK ACTIVITIES
// ============================================================================

function deriveWeekActivities(weekIdx) {
  const scn = currentScn();
  if (!scn) return [];
  const monday = weekStartDate(weekIdx);
  const weekDates = {};
  DAYS.forEach((d, i) => { weekDates[d] = formatDateISO(addDays(monday, i)); });

  const activities = [];

  scn.cohorts.forEach(cohort => {
    cohort.sessions.forEach(s => {
      if (s.dateStr === weekDates[s.day]) {
        const mod = MODULES.find(m => m.id === s.moduleId);
        const facilitator = (cohort.facilitators && cohort.facilitators[s.day]) || cohort.facilitator || 'iain';
        activities.push({
          level: mod ? mod.level : null,
          person: facilitator,
          day: s.day,
          session: s.session,
          type: s.isHoliday ? 'holiday' : 'training',
          cohort: `Cohort ${cohort.number}`,
          cohortId: cohort.id,
          moduleId: s.moduleId,
          moduleName: mod ? mod.short : '',
          isHoliday: s.isHoliday,
          holidayName: s.holidayName,
          isMakeup: !!s.isMakeup,
          makeupFor: s.makeupFor || null,
          source: 'cohort',
        });
      }
    });
  });

  scn.ongoing.forEach(ong => {
    const startWeekIdx = weekIndexFromDate(parseDate(ong.startDate));
    let endWeekIdx = Infinity;
    if (ong.endDate) endWeekIdx = weekIndexFromDate(parseDate(ong.endDate));
    if (weekIdx >= startWeekIdx && weekIdx <= endWeekIdx) {
      ong.slots.forEach(slot => {
        const holiday = isHoliday(weekDates[slot.day]);
        activities.push({
          person: (ong.facilitators && ong.facilitators[slot.day]) || ong.facilitator || 'iain',
          level: ong.type === 'l3' ? 3 : null,
          day: slot.day,
          session: slot.session,
          type: ong.type,
          cohort: ong.name,
          ongoingId: ong.id,
          isHoliday: !!holiday,
          holidayName: holiday ? holiday.name : null,
          source: 'ongoing',
        });
      });
    }
  });

  return activities;
}

function getWeekActivities(weekIdx) {
  const scn = currentScn();
  const override = scn && scn.overrides[weekIdx];
  // A week with an override uses the override as its full set of activities
  if (Array.isArray(override)) return override;
  return deriveWeekActivities(weekIdx);
}

function hasOverride(weekIdx) {
  const scn = currentScn();
  return !!(scn && scn.overrides[weekIdx]);
}

function materializeOverride(weekIdx) {
  const scn = currentScn();
  if (!scn.overrides[weekIdx]) scn.overrides[weekIdx] = structuredClone(deriveWeekActivities(weekIdx));
  return scn.overrides[weekIdx];
}

function getActivitiesAt(weekIdx, person, day, session) {
  return getWeekActivities(weekIdx).filter(a => a.person === person && a.day === day && a.session === session);
}

function addActivity(weekIdx, activity) {
  const acts = structuredClone(materializeOverride(weekIdx));
  acts.push(activity);
  currentScn().overrides[weekIdx] = acts;
  commit();
}

function removeActivity(weekIdx, idx) {
  const acts = structuredClone(materializeOverride(weekIdx));
  acts.splice(idx, 1);
  currentScn().overrides[weekIdx] = acts;
  commit();
}

function updateActivity(weekIdx, idx, newData) {
  const acts = structuredClone(materializeOverride(weekIdx));
  acts[idx] = Object.assign(acts[idx], newData);
  currentScn().overrides[weekIdx] = acts;
  commit();
}

// ============================================================================
// TIMESLOT OCCUPANCY
// ============================================================================
// Level 1–2 cohorts and Level 3 groups each hold a training timeslot. Two holders
// clash when they share a day and session over overlapping dates.

const FAR_FUTURE = new Date(9999, 0, 1);

function slotHolders(scn) {
  const out = [];
  scn.cohorts.forEach(c => {
    const ts = TIMESLOTS.find(t => t.id === c.timeslotId);
    const end = cohortEndDate(c);
    if (ts && end) out.push({ kind: 'cohort', id: c.id, label: `Cohort ${c.number}`, ts, start: parseDate(c.startDate), end });
  });
  scn.ongoing.filter(o => o.type === 'l3').forEach(o => {
    const ts = TIMESLOTS.find(t => t.id === o.timeslotId);
    if (ts) out.push({ kind: 'l3', id: o.id, label: o.name, ts, start: parseDate(o.startDate), end: o.endDate ? parseDate(o.endDate) : null });
  });
  return out;
}

// Shared days when a and b clash, otherwise null
function clashDays(a, b) {
  if (a.ts.session !== b.ts.session) return null;
  const shared = a.ts.days.filter(d => b.ts.days.includes(d));
  if (shared.length === 0) return null;
  if ((a.end || FAR_FUTURE) < b.start || (b.end || FAR_FUTURE) < a.start) return null;
  return shared;
}

function slotBlockers(timeslotId, start, end, excludeId) {
  const ts = TIMESLOTS.find(t => t.id === timeslotId);
  if (!ts) return [];
  const candidate = { ts, start, end };
  return slotHolders(currentScn())
    .filter(h => h.id !== excludeId)
    .map(h => ({ ...h, sharedDays: clashDays(candidate, h) }))
    .filter(h => h.sharedDays);
}

function clashesById(scn) {
  const holders = slotHolders(scn);
  const map = {};
  for (let i = 0; i < holders.length; i++) {
    for (let j = i + 1; j < holders.length; j++) {
      const shared = clashDays(holders[i], holders[j]);
      if (!shared) continue;
      (map[holders[i].id] = map[holders[i].id] || []).push({ label: holders[j].label, sharedDays: shared });
      (map[holders[j].id] = map[holders[j].id] || []).push({ label: holders[i].label, sharedDays: shared });
    }
  }
  return map;
}

// First and last session date of each level in a cohort
function cohortLevelSpans(c) {
  const spans = {};
  c.sessions.forEach(s => {
    const lvl = moduleLevel(s.moduleId);
    if (!lvl) return;
    const d = parseDate(s.dateStr);
    if (!spans[lvl]) spans[lvl] = { start: d, end: d };
    if (d < spans[lvl].start) spans[lvl].start = d;
    if (d > spans[lvl].end) spans[lvl].end = d;
  });
  return spans;
}

function cohortLevelInWeek(c, weekIdx) {
  const spans = cohortLevelSpans(c);
  if (spans[2] && weekIdx >= weekIndexFromDate(spans[2].start)) return 2;
  return 1;
}

// ============================================================================
// HOUR CALCULATIONS
// ============================================================================

function getDeliveryHours(weekIdx, person) {
  return getSessionCount(weekIdx, person) * 3; // 3 hours per session
}

function getSessionCount(weekIdx, person) {
  return getWeekActivities(weekIdx).filter(a => a.person === person && !a.isHoliday).length;
}

function getDeliveryHoursByType(weekIdx, person, type) {
  return getWeekActivities(weekIdx).filter(a => a.person === person && a.type === type && !a.isHoliday).length * 3;
}

function cohortEndDate(c) {
  const last = c.sessions[c.sessions.length - 1];
  return last ? parseDate(last.dateStr) : null;
}

function getActiveCohortsForWeek(weekIdx) {
  return currentScn().cohorts.filter(c => {
    const end = cohortEndDate(c);
    if (!end) return false;
    return weekIdx >= weekIndexFromDate(parseDate(c.startDate)) && weekIdx <= weekIndexFromDate(end);
  });
}

function getActiveOngoingForWeek(weekIdx) {
  return currentScn().ongoing.filter(ong => {
    const startWeekIdx = weekIndexFromDate(parseDate(ong.startDate));
    const endWeekIdx = ong.endDate ? weekIndexFromDate(parseDate(ong.endDate)) : Infinity;
    return weekIdx >= startWeekIdx && weekIdx <= endWeekIdx;
  });
}
